<title>SeatChart Super Admin</title>
<style>
:root{--p:#2457d6;--pd:#1d46b0;--ink:#172033;--muted:#6d778b;--bg:#f5f7fb;--white:#fff;--line:#e4e8ef;--good:#218653;--bad:#c93636;--warn:#a66b00;--side:235px}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:var(--side);background:#fff;border-right:1px solid var(--line);z-index:20;display:flex;flex-direction:column}.brand{height:68px;padding:0 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.mark{width:35px;height:35px;border-radius:9px;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:800}.brand b{font-size:18px}.brand small{display:block;color:var(--muted);font-size:8px;letter-spacing:.5px}.nav{padding:15px 11px}.navlabel{font-size:9px;color:#939aab;font-weight:800;letter-spacing:.8px;padding:13px 10px 6px}.nav a{display:flex;gap:10px;align-items:center;padding:10px;border-radius:8px;color:#596579;text-decoration:none;font-weight:650;font-size:12px;margin:2px 0}.nav a:hover,.nav a.active{background:#edf2ff;color:var(--p)}.ni{width:18px;text-align:center}.sideuser{margin-top:auto;border-top:1px solid var(--line);padding:13px}.user{display:flex;align-items:center;gap:9px}.avatar{width:34px;height:34px;border-radius:50%;background:#e9eefb;color:var(--p);display:grid;place-items:center;font-size:11px;font-weight:800}.uname{font-size:11px;font-weight:750}.role{font-size:9px;color:var(--muted)}.main{margin-left:var(--side);min-height:100vh}.header{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:sticky;top:0;z-index:10}.headtitle{font-size:14px;font-weight:750}.headright{display:flex;align-items:center;gap:12px}.content{padding:26px;max-width:1550px;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:20px}.top h1{font-size:23px;margin:0;letter-spacing:-.5px}.top p{color:var(--muted);font-size:12px;margin:5px 0}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;color:#536075;border-radius:8px;padding:9px 13px;font-size:11px;font-weight:700}.btn.primary{border-color:var(--p);background:var(--p);color:#fff}.btn.danger{color:var(--bad)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:17px}.label{font-size:9px;text-transform:uppercase;letter-spacing:.7px;color:#8a94a5;font-weight:800}.metric{font-size:27px;font-weight:800;margin-top:8px}.note{font-size:10px;color:var(--muted);margin-top:4px}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}.cardhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.cardhead h2{font-size:14px;margin:0}.link{font-size:10px;color:var(--p);font-weight:750;cursor:pointer}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:9px;background:#fff}.table{width:100%;border-collapse:collapse;min-width:760px}.table th{text-align:left;font-size:9px;color:#8a94a5;text-transform:uppercase;letter-spacing:.5px;padding:12px;border-bottom:1px solid var(--line)}.table td{padding:12px;font-size:11px;border-bottom:1px solid #eef1f5}.table tr:last-child td{border-bottom:0}.actions-cell{white-space:nowrap}.badge{font-size:8px;border-radius:20px;padding:5px 8px;font-weight:750;background:#eef8f2;color:var(--good)}.badge.bad{background:#fff0f0;color:var(--bad)}.searchbar{display:flex;gap:9px;margin-bottom:13px}.searchbar input{flex:1;border:1px solid #d9dee7;border-radius:8px;padding:10px 11px;background:#fff;outline:0}.empty{text-align:center;padding:25px;color:var(--muted);font-size:10px}.modalbg{position:fixed;inset:0;background:#10192a80;z-index:50;display:none;align-items:center;justify-content:center;padding:18px}.modal{width:min(1050px,100%);background:#fff;border-radius:13px;padding:22px;max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between}.modal h2{font-size:17px;margin:0 0 5px}.modal p{font-size:11px;color:var(--muted);margin:0 0 18px}.x{border:0;background:none;font-size:20px;color:#758095}.field{margin-bottom:14px}.field label{display:block;font-size:10px;font-weight:750;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #d9dee7;border-radius:8px;padding:10px 11px;outline:none;background:#fff;color:var(--ink)}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.mini{background:#f8faff;border:1px solid var(--line);border-radius:8px;padding:11px}.mini b{display:block;font-size:17px}.mini span{font-size:8px;color:var(--muted);text-transform:uppercase}.login{min-height:100vh;display:grid;place-items:center;padding:22px}.loginbox{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:15px;padding:25px}.loginbrand{display:flex;align-items:center;gap:10px;margin-bottom:20px}.error{background:#fff0f0;color:#a93232;border:1px solid #ffd2d2;border-radius:8px;padding:9px;font-size:10px;margin-bottom:13px}.setup{background:#f3f7ff;color:#50627e;border:1px solid #d7e3ff;border-radius:8px;padding:10px;font-size:10px;margin-top:12px}.toast{position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:11px 14px;border-radius:8px;font-size:11px;z-index:80}.muted{color:var(--muted)}@media(max-width:900px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.hamb{display:block;border:0;background:none;font-size:22px}.header{padding:0 15px}.content{padding:18px}.cards{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.detail-grid{grid-template-columns:repeat(2,1fr)}}@media(min-width:901px){.hamb{display:none}}@media(max-width:560px){.cards{grid-template-columns:repeat(2,1fr);gap:9px}.top{flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.split{grid-template-columns:1fr}.detail-grid{grid-template-columns:repeat(2,1fr)}}
</style>

<body>
<div id="app"></div>
<div id="modalbg" class="modalbg"><div id="modal" class="modal"></div></div>
<script>
const SUPABASE_URL='https://iykvboyzviguuaejppkw.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml5a3Zib3l6dmlndXVhZWpwcGt3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTYxODY3OTAsImV4cCI6MjA3MTc2Mjc5MH0.tmBPm6UjDapcCb9xjq60vdtEIY2mCNjd7ar-85l_P3w';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const APP={user:null,admin:null,page:'dashboard',schools:[],selectedSchool:null};
const titles={dashboard:'Dashboard',schools:'Schools / Apps'};
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function emailForPhone(v){return String(v||'').replace(/\D/g,'')+'@login.seatchart.app'}
function normalizePhone(v){v=String(v||'').replace(/\D/g,'');return v.length===10?'+91'+v:v}
function showLogin(message=''){document.body.innerHTML='<div class="login"><div class="loginbox"><div class="loginbrand"><div class="mark">SC</div><div><div style="font-weight:800;font-size:18px">SeatChart</div><div style="font-size:8px;color:#6d778b;letter-spacing:.7px">SUPER ADMIN CONSOLE</div></div></div><h2 style="margin:0 0 5px">Super Admin Sign In</h2><p style="font-size:11px;color:#6d778b;margin:0 0 18px">This console is separate from the school application.</p><div id="err">'+(message?'<div class="error">'+esc(message)+'</div>':'')+'</div><div class="field"><label>Phone Number *</label><input id="phone" maxlength="10" inputmode="numeric" placeholder="10 digit number"></div><div class="field"><label>6-Digit PIN *</label><input id="pin" type="password" maxlength="6" inputmode="numeric" placeholder="••••••"></div><button class="btn primary" style="width:100%" onclick="login()">LOGIN</button><div class="setup">Super Admin access is controlled separately from school Administrator access. An account must be explicitly authorized as a Super Admin before it can enter this console.</div></div></div>'}
function err(msg){document.getElementById('err').innerHTML='<div class="error">'+esc(msg)+'</div>'}
async function login(){const phone=normalizePhone(document.getElementById('phone').value),pin=document.getElementById('pin').value;if(!/^\+91\d{10}$/.test(phone)||!/^[0-9]{6}$/.test(pin))return err('Enter a valid 10-digit Indian phone number and 6-digit PIN.');const {error}=await db.auth.signInWithPassword({email:emailForPhone(phone),password:pin});if(error)return err(error.message);await bootstrap()}
async function bootstrap(){const {data:{user}}=await db.auth.getUser();if(!user)return showLogin();APP.user=user;const r=await db.rpc('sc_super_admin_bootstrap');if(r.error){await db.auth.signOut();return showLogin('This account is not authorized as a Super Admin.');}APP.admin=r.data;render();go('dashboard')}
function render(){document.body.innerHTML='<div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="mark">SC</div><div><b>SeatChart</b><small>SUPER ADMIN CONSOLE</small></div></div><nav class="nav"><div class="navlabel">PLATFORM</div><a href="#dashboard" id="nav-dashboard" onclick="go(\'dashboard\')"><span class="ni">⌂</span>Dashboard</a><a href="#schools" id="nav-schools" onclick="go(\'schools\')"><span class="ni">▦</span>Schools / Apps</a><div class="navlabel">SYSTEM</div><a href="#users" onclick="go(\'users\')"><span class="ni">◉</span>New Users</a><a href="#activity" onclick="go(\'activity\')"><span class="ni">◷</span>Activity</a></nav><div class="sideuser"><div class="user"><div class="avatar">'+esc((APP.admin?.full_name||'SA').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase())+'</div><div><div class="uname">'+esc(APP.admin?.full_name||'Super Admin')+'</div><div class="role">Super Administrator</div></div><button class="btn" style="margin-left:auto;padding:6px 8px" onclick="logout()">↪</button></div></div></aside><main class="main"><header class="header"><div><button class="hamb" onclick="document.getElementById(\'sidebar\').classList.toggle(\'open\')">☰</button><span class="headtitle" id="title">Dashboard</span></div><div class="headright"><span class="muted" style="font-size:10px">All schools</span></div></header><section id="view" class="content"></section></main></div>'}
function go(page){APP.page=page;document.getElementById('title').textContent=titles[page]||page[0].toUpperCase()+page.slice(1);document.querySelectorAll('.nav a').forEach(x=>x.classList.remove('active'));document.getElementById('nav-'+page)?.classList.add('active');document.getElementById('sidebar')?.classList.remove('open');if(page==='dashboard')loadDashboard();else if(page==='schools')loadSchools();else if(page==='users')loadNewUsers();else if(page==='activity')loadActivity()}
async function loadDashboard(){const v=document.getElementById('view');v.innerHTML='<div class="card">Loading dashboard…</div>';const r=await db.rpc('sc_super_admin_dashboard');if(r.error)return v.innerHTML='<div class="card error">'+esc(r.error.message)+'</div>';v.innerHTML=dashboardHtml(r.data)}
function dashboardHtml(d){const t=d.totals||{},schools=d.new_schools||[],users=d.new_users||[];return '<div class="top"><div><h1>Super Admin Dashboard</h1><p>Platform-wide view of every SeatChart school application.</p></div><div class="actions"><button class="btn" onclick="loadDashboard()">↻ REFRESH</button><button class="btn primary" onclick="go(\'schools\')">MANAGE SCHOOLS</button></div></div><div class="cards">'+[['Schools',t.schools,'All registered schools',''],['Active Schools',t.active_schools,'Currently active','good'],['Users',t.users,'Registered users',''],['Students',t.students,'Configured across schools',''],['Rooms',t.rooms,'Configured rooms',''],['Subjects',t.subjects,'Configured subjects',''],['Exams',t.exams,'Exam plans',''],['Seating Plans',t.seating_plans,'Generated seating plans','']].map(x=>'<div class="card"><div class="label">'+x[0]+'</div><div class="metric">'+Number(x[1]||0).toLocaleString()+'</div><div class="note '+x[3]+'">'+x[2]+'</div></div>').join('')+'</div><div class="cols"><div class="card"><div class="cardhead"><h2>New School Registrations</h2><span class="link" onclick="go(\'schools\')">VIEW ALL</span></div><div class="tablewrap"><table class="table"><thead><tr><th>School</th><th>Users</th><th>Students</th><th>Status</th><th>Registered</th></tr></thead><tbody>'+(schools.length?schools.map(x=>'<tr><td><b>'+esc(x.name)+'</b></td><td>'+x.user_count+'</td><td>'+x.student_count+'</td><td>'+statusBadge(x.status)+'</td><td>'+date(x.created_at)+'</td></tr>').join(''):'<tr><td colspan="5" class="empty">No schools registered yet.</td></tr>')+'</tbody></table></div></div><div class="card"><div class="cardhead"><h2>New User Registrations</h2><span class="link" onclick="go(\'users\')">VIEW ALL</span></div><div class="tablewrap"><table class="table"><thead><tr><th>User</th><th>School</th><th>Role</th><th>Registered</th></tr></thead><tbody>'+(users.length?users.map(x=>'<tr><td><b>'+esc(x.full_name)+'</b><div class="note">'+esc(x.phone)+'</div></td><td>'+esc(x.school_name||'—')+'</td><td>'+esc(x.role||'')+'</td><td>'+date(x.created_at)+'</td></tr>').join(''):'<tr><td colspan="4" class="empty">No users registered yet.</td></tr>')+'</tbody></table></div></div></div>'}
function statusBadge(s){return '<span class="badge '+(s==='Suspended'?'bad':'')+'">'+esc(s||'Active')+'</span>'}
function date(v){return v?new Date(v).toLocaleString(): '—'}
async function loadSchools(){const v=document.getElementById('view');v.innerHTML='<div class="card">Loading schools…</div>';const r=await db.rpc('sc_super_admin_schools');if(r.error)return v.innerHTML='<div class="card error">'+esc(r.error.message)+'</div>';APP.schools=r.data||[];v.innerHTML=schoolsHtml(APP.schools)}
function schoolsHtml(rows){return '<div class="top"><div><h1>Schools / Apps</h1><p>Manage every SeatChart school tenant from one console.</p></div><div class="actions"><button class="btn" onclick="loadSchools()">↻ REFRESH</button></div></div><div class="searchbar"><input id="schoolSearch" placeholder="Search school, phone or address…" oninput="filterSchools()"></div><div class="tablewrap"><table class="table" id="schoolTable"><thead><tr><th>School</th><th>Status</th><th>Users</th><th>Students</th><th>Rooms</th><th>Subjects</th><th>Exams</th><th>Seating</th><th>Registered</th><th>Actions</th></tr></thead><tbody>'+(rows.length?rows.map(x=>'<tr data-search="'+esc((x.name+' '+(x.phone||'')+' '+(x.address||'')).toLowerCase())+'"><td><b>'+esc(x.name)+'</b><div class="note">'+esc(x.phone||'No phone')+'</div></td><td>'+statusBadge(x.status)+'</td><td>'+x.user_count+'</td><td>'+x.student_count+'</td><td>'+x.room_count+'</td><td>'+x.subject_count+'</td><td>'+x.exam_count+'</td><td>'+x.seating_plan_count+'</td><td>'+date(x.created_at)+'</td><td class="actions-cell"><button class="btn" onclick="openSchool(\''+x.id+'\')">DETAILS</button> <button class="btn primary" onclick="editSchool(\''+x.id+'\')">MANAGE</button></td></tr>').join(''):'<tr><td colspan="10" class="empty">No schools found.</td></tr>')+'</tbody></table></div>'}
function filterSchools(){const q=String(document.getElementById('schoolSearch')?.value||'').toLowerCase();document.querySelectorAll('#schoolTable tbody tr').forEach(r=>r.style.display=(r.dataset.search||'').includes(q)?'':'none')}
async function openSchool(id){const v=document.getElementById('view');v.innerHTML='<div class="card">Loading school details…</div>';const r=await db.rpc('sc_super_admin_school_detail',{p_school_id:id});if(r.error){v.innerHTML='<div class="card error">'+esc(r.error.message)+'</div>';return}APP.selectedSchool=r.data;renderSchoolDetail(r.data)}
function renderSchoolDetail(d){const s=d.school||{},t=d.totals||{};document.getElementById('title').textContent=s.name||'School Details';const metrics=[['Users',t.users],['Students',t.students],['Classes',t.classes],['Sections',t.sections],['Rooms',t.rooms],['Subjects',t.subjects],['Exams',t.exams],['Seating Plans',t.seating_plans],['Exam Schedules',t.exam_schedules],['Seat Assignments',t.seating_assignments]];document.getElementById('view').innerHTML='<div class="top"><div><h1>'+esc(s.name)+'</h1><p>'+esc(s.address||'No address')+' · '+esc(s.phone||'No phone')+'</p></div><div class="actions"><button class="btn" onclick="loadSchools()">← BACK</button><button class="btn primary" onclick="editSchool(\''+s.id+'\')">EDIT SCHOOL</button></div></div><div class="card"><div class="cardhead"><h2>School Status</h2>'+statusBadge(s.status)+'</div>'+(s.status==='Suspended'?'<div class="note bad">Suspension reason: '+esc(s.suspension_reason||'Not specified')+'</div>':'<div class="note good">School application is active.</div>')+'<div class="note">Registered '+date(s.created_at)+'</div></div><div class="detail-grid">'+metrics.map(x=>'<div class="mini"><b>'+Number(x[1]||0).toLocaleString()+'</b><span>'+x[0]+'</span></div>').join('')+'</div><div class="cols"><div class="card"><div class="cardhead"><h2>School Users</h2><span class="note">'+(d.users||[]).length+' users</span></div><div class="tablewrap"><table class="table"><thead><tr><th>Name</th><th>Phone</th><th>Role</th><th>Created</th></tr></thead><tbody>'+((d.users||[]).map(x=>'<tr><td><b>'+esc(x.full_name)+'</b></td><td>'+esc(x.phone)+'</td><td>'+esc(x.role)+'</td><td>'+date(x.created_at)+'</td></tr>').join('')||'<tr><td colspan="4" class="empty">No users.</td></tr>')+'</tbody></table></div></div><div class="card"><div class="cardhead"><h2>Exam Plans</h2><span class="note">'+(d.exams||[]).length+' exams</span></div><div class="tablewrap"><table class="table"><thead><tr><th>Exam</th><th>Period</th><th>Status</th></tr></thead><tbody>'+((d.exams||[]).map(x=>'<tr><td><b>'+esc(x.exam_name)+'</b></td><td>'+esc(x.start_date)+' – '+esc(x.end_date)+'</td><td>'+esc(x.status)+'</td></tr>').join('')||'<tr><td colspan="3" class="empty">No exams planned.</td></tr>')+'</tbody></table></div></div></div><div class="card" style="margin-top:18px"><div class="cardhead"><h2>Academic Sessions</h2><span class="note">'+(d.sessions||[]).length+' sessions</span></div><div class="tablewrap"><table class="table"><thead><tr><th>Session</th><th>Start</th><th>End</th><th>Current</th></tr></thead><tbody>'+((d.sessions||[]).map(x=>'<tr><td><b>'+esc(x.session_name)+'</b></td><td>'+esc(x.start_date)+'</td><td>'+esc(x.end_date)+'</td><td>'+statusBadge(x.is_current?'Current':'Archived')+'</td></tr>').join('')||'<tr><td colspan="4" class="empty">No sessions.</td></tr>')+'</tbody></table></div></div>'}
function editSchool(id){const s=APP.schools.find(x=>x.id===id)||APP.selectedSchool?.school;if(!s)return;document.getElementById('modal').innerHTML='<div class="modalhead"><h2>Manage School</h2><button class="x" onclick="closeModal()">×</button></div><p>Update the tenant profile and application access.</p><div class="field"><label>School Name *</label><input id="esName" value="'+esc(s.name||'')+'"></div><div class="field"><label>Address</label><textarea id="esAddress" rows="3">'+esc(s.address||'')+'</textarea></div><div class="split"><div class="field"><label>Phone</label><input id="esPhone" value="'+esc(s.phone||'')+'"></div><div class="field"><label>Status</label><select id="esStatus"><option value="Active" '+(s.status==='Active'?'selected':'')+'>Active</option><option value="Suspended" '+(s.status==='Suspended'?'selected':'')+'>Suspended</option></select></div></div><div class="field"><label>Suspension Reason</label><textarea id="esReason" rows="2" placeholder="Required when suspended">'+esc(s.suspension_reason||'')+'</textarea></div><div style="text-align:right"><button class="btn" onclick="closeModal()">CANCEL</button><button class="btn primary" onclick="saveSchool(\''+s.id+'\')">SAVE CHANGES</button></div>';document.getElementById('modalbg').style.display='flex'}
async function saveSchool(id){const name=document.getElementById('esName').value.trim(),address=document.getElementById('esAddress').value.trim(),phone=normalizePhone(document.getElementById('esPhone').value),status=document.getElementById('esStatus').value,reason=document.getElementById('esReason').value.trim();if(!name)return alertToast('School name is required.');if(phone&&!/^\+91\d{10}$/.test(phone))return alertToast('Enter a valid 10-digit Indian phone number.');if(status==='Suspended'&&!reason)return alertToast('Add a suspension reason.');const r=await db.rpc('sc_super_admin_update_school',{p_school_id:id,p_name:name,p_address:address,p_phone:phone,p_status:status,p_suspension_reason:reason||null});if(r.error)return alertToast(r.error.message);closeModal();alertToast('School updated successfully.');if(APP.page==='schools')await loadSchools();else await openSchool(id)}
function closeModal(){document.getElementById('modalbg').style.display='none'}
function alertToast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3000)}
async function loadNewUsers(){const r=await db.rpc('sc_super_admin_users');if(r.error)return document.getElementById('view').innerHTML='<div class="card error">'+esc(r.error.message)+'</div>';const users=r.data||[];document.getElementById('view').innerHTML='<div class="top"><div><h1>Users</h1><p>All registered SeatChart users across every school, newest first.</p></div></div><div class="searchbar"><input id="userSearch" placeholder="Search user, phone, school or role…" oninput="filterUsers()"></div><div class="tablewrap"><table class="table" id="userTable"><thead><tr><th>User</th><th>School</th><th>Role</th><th>Phone</th><th>School Status</th><th>Registered</th></tr></thead><tbody>'+users.map(x=>'<tr data-search="'+esc((x.full_name+' '+(x.phone||'')+' '+(x.school_name||'')+' '+(x.role||'')).toLowerCase())+'"><td><b>'+esc(x.full_name)+'</b></td><td>'+esc(x.school_name||'—')+'</td><td>'+esc(x.role||'')+'</td><td>'+esc(x.phone||'')+'</td><td>'+statusBadge(x.school_status)+'</td><td>'+date(x.created_at)+'</td></tr>').join('')+'</tbody></table></div>'}
function filterUsers(){const q=String(document.getElementById('userSearch')?.value||'').toLowerCase();document.querySelectorAll('#userTable tbody tr').forEach(r=>r.style.display=(r.dataset.search||'').includes(q)?'':'none')}
async function loadActivity(){const r=await db.rpc('sc_super_admin_dashboard');if(r.error)return document.getElementById('view').innerHTML='<div class="card error">'+esc(r.error.message)+'</div>';document.getElementById('view').innerHTML='<div class="top"><div><h1>Activity</h1><p>Platform registration activity. Detailed school activity is available inside each school.</p></div></div><div class="cols"><div class="card"><div class="cardhead"><h2>Latest Schools</h2></div>'+((r.data?.new_schools||[]).map(x=>'<div style="padding:10px 0;border-top:1px solid var(--line)"><b>'+esc(x.name)+'</b><div class="note">'+date(x.created_at)+' · '+x.user_count+' users · '+x.student_count+' students</div></div>').join('')||'<div class="empty">No activity.</div>')+'</div><div class="card"><div class="cardhead"><h2>Latest Users</h2></div>'+((r.data?.new_users||[]).map(x=>'<div style="padding:10px 0;border-top:1px solid var(--line)"><b>'+esc(x.full_name)+'</b><div class="note">'+esc(x.school_name||'')+' · '+date(x.created_at)+'</div></div>').join('')||'<div class="empty">No activity.</div>')+'</div></div>'}
async function logout(){await db.auth.signOut();location.reload()}
document.getElementById('modalbg').onclick=e=>{if(e.target.id==='modalbg')closeModal()};
window.addEventListener('load',async()=>{const {data:{user}}=await db.auth.getUser();if(user)await bootstrap();else showLogin()});
</script>
</body>
</html>
