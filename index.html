px}.section:first-child{border-top:0;padding-top:0;margin-top:0}.sectitle{font-size:9px;color:#737e91;font-weight:800;letter-spacing:.7px;margin-bottom:12px}.check{display:flex;gap:8px;font-size:10px;color:var(--muted);align-items:flex-start;margin:12px 0}.check input{width:auto}.timeline{border-left:2px solid #e7ebf2;margin-left:8px;padding-left:22px}.event{position:relative;padding:0 0 22px}.event:before{content:"";position:absolute;left:-29px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--p);border:3px solid var(--bg)}.event time{font-size:9px;color:#8a94a5}.event b{display:block;font-size:11px;margin-top:3px}.event span{font-size:9px;color:var(--muted)}.calendar{background:#fff;border:1px solid var(--line);border-radius:11px;overflow:auto}.calhead{display:flex;justify-content:space-between;padding:15px;border-bottom:1px solid var(--line);align-items:center}.calgrid{display:grid;grid-template-columns:repeat(7,minmax(105px,1fr));min-width:735px}.calgrid>div{min-height:90px;border-right:1px solid #eef1f5;border-bottom:1px solid #eef1f5;padding:8px;font-size:10px}.dayname{min-height:auto!important;font-size:9px!important;color:#7b869a;text-transform:uppercase;font-weight:800}.daynum{font-weight:750;font-size:11px}.eventchip{background:#eff3ff;color:var(--p);border-radius:7px;padding:6px;margin-top:8px;font-size:8px}.login{min-height:100vh;display:grid;place-items:center;padding:22px}.loginbox{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:15px;padding:25px}.loginbrand{display:flex;align-items:center;gap:10px;margin-bottom:18px}.error-note{background:#fff0f0;color:#a93232;border:1px solid #ffd2d2;border-radius:8px;padding:9px;font-size:10px;margin-bottom:13px}.setup-note{background:#f3f7ff;color:#50627e;border:1px solid #d7e3ff;border-radius:8px;padding:10px;font-size:10px;margin:10px 0}.roll-tools{display:flex;gap:8px;margin-bottom:10px}.roll-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.roll-che function authError(msg){document.getElementById('authError').innerHTML=`<div class="error-note">${msg}</div>`}
function normalizePhone(v){v=String(v||'').replace(/\D/g,'');return v.length===10?'+91'+v:v}
function loginForm(){return `<div class="field"><label>Phone Number *</label><input id="authPhone" maxlength="10" inputmode="numeric" placeholder="10 digit number"></div><div class="field"><label>6-Digit PIN *</label><input id="authPin" type="password" maxlength="6" inputmode="numeric" placeholder="••••••"></div><button class="btn primary" style="width:100%" onclick="loginReal()">LOGIN</button><button class="btn" style="width:100%;margin-top:8px" onclick="showAuth('signup')">CREATE NEW SCHOOL ACCOUNT</button>`}
function signupForm(){return `<div class="split"><div class="field"><label>Administrator Full Name *</label><input id="suName" placeholder="Full name"></div><div class="field"><label>Phone Number *</label><input id="suPhone" maxlength="10" inputmode="numeric" placeholder="10 digit number"></div></div><div class="field"><label>School Name *</label><input id="suSchool" placeholder="School name"></div><div class="field"><label>School Address</label><textarea id="suAddress" rows="2" placeholder="Optional"></textarea></div><div class="split"><div class="field"><label>6-Digit PIN *</label><input id="suPin" type="password" maxlength="6" inputmode="numeric"></div><div class="field"><label>Confirm PIN *</label><input id="suPin2" type="password" maxlength="6" inputmode="numeric"></div></div><div class="setup-note">Phone Number is the SeatChart username and the 6-digit PIN is the password. No SMS, OTP, phone verification or email is used.</div><div style="margin-top:12px"><button class="btn primary" style="width:100%" onclick="signupReal()">CREATE ACCOUNT</button></div>`}
function showAuth(mode){document.body.innerHTML=`<div class="login"><div class="loginbox"><div class="loginbrand"><div class="mark">SC</div><div><div style="font-weight:800;font-size:18px">SeatChart</div><div style="font-size:8px;color:#6d778b;letter-spacing:.7px">SCHOOL EXAMINATION & SEATING MANAGEMENT</div></div></div><h2 style="margin:0 0 5px">${mode==='login'?'Sign in to SeatChart':'Create SeatChart Account'}</h2><p style="font-size:11px;color:#6d778b;margin:0 0 18px">${mode==='login'?'Use your school phone number and 6-digit PIN.':'Create the administrator account for one school.'}</p><div id="authError"></div><div id="authForm">${mode==='login'?loginForm():signupForm()}</div></div></div>`}
function accountEmail(phone){return phone.replace(/\D/g,'')+'@login.seatchart.app'}
async function loginReal(){const phone=normalizePhone(document.getElementById('authPhone').value),pin=document.getElementById('authPin').value;if(!/^\+91\d{10}$/.test(phone)||!/^[0-9]{6}$/.test(pin))return authError('Enter a valid 10-digit Indian phone number and 6-digit PIN.');const {data,error}=await db.auth.signInWithPassword({email:accountEmail(phone),password:pin});if(error)return authError(error.message);await bootstrap()}
async function signupReal(){const name=document.getElementById('suName').value.trim(),phone=normalizePhone(document.getElementById('suPhone').value),school=document.getElementById('suSchool').value.trim(),address=document.getElementById('suAddress').value.trim(),pin=document.getElementById('suPin').value,pin2=document.getElementById('suPin2').value;if(!name||!school||!/^[0-9]{6}$/.test(pin)||pin!==pin2||!/^\+91\d{10}$/.test(phone))return authError('Please complete all required fields and use a matching 6-digit PIN.');const {data,error}=await db.auth.signUp({email:accountEmail(phone),password:pin});if(error)return authError(error.message);if(!data.session)return authError('Account created, but Supabase email confirmation is enabled. Disable email confirmation for the no-email workflow.');const uid=data.user.id;let r=await db.from('sc_schools').insert({name:school,address:address||null,phone,created_by:uid}).select('id').single();if(r.error)return authError(r.error.message);const schoolId=r.data.id;r=await db.from('sc_user_profiles').insert({id:uid,school_id:schoolId,full_name:name,phone,role:'Administrator'});if(r.error)return authError(r.error.message);await ensureCurrentSession(schoolId);await bootstrap()}
async function ensureCurrentSession(schoolId){const now=new Date(),startYear=now.getMonth()>=3?now.getFullYear():now.getFullYear()-1,endYear=startYear+1,name=`${startYear}–${String(endYear).slice(-2)}`;let {data}=await db.from('sc_academic_sessions').select('*').eq('school_id',schoolId).eq('session_name',name).maybeSingle();if(!data){let r=await db.from('sc_academic_sessions').insert({school_id:schoolId,session_name:name,start_date:`${startYear}-04-01`,end_date:`${endYear}-03-31`,is_current:true}).select('*').single();data=r.data}return data}
async function bootstrap(){const {data:{user}}=await db.auth.getUser();if(!user){showAuth('login');return}APP.user=user;let r=await db.from('sc_user_profiles').select('*,sc_schools(*)').eq('id',user.id).single();if(r.error){authError(r.error.message);return}APP.profile=r.data;APP.schoolId=r.data.school_id;const s=await ensureCurrentSession(APP.schoolId);APP.sessionId=s.id;renderApp();go('dashboard')}
function renderApp(){document.body.innerHTML=`<div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="mark">SC</div><div><b>SeatChart</b><small>SCHOOL EXAMINATION & SEATING MANAGEMENT</small></div></div><nav class="nav"><div class="navlabel">ACADEMIC SETUP</div><a href="#dashboard" onclick="go('dashboard')" id="nav-dashboard"><span class="ni">⌂</span>Dashboard</a><a href="#classes" onclick="go('classes')" id="nav-classes"><span class="ni">▦</span>Classes & Sections</a><a href="#rooms" onclick="go('rooms')" id="nav-rooms"><span class="ni">⌑</span>Rooms</a><a href="#subjects" onclick="go('subjects')" id="nav-subjects"><span class="ni">◈</span>Subjects</a><div class="navlabel">EXAMINATION</div><a href="#planner" onclick="go('planner')" id="nav-planner"><span class="ni">◫</span>Exam Planner</a><a href="#exams" onclick="go('exams')" id="nav-exams"><span class="ni">▣</span>Exams</a><div class="navlabel">SETTINGS</div><a href="#users" onclick="go('users')" id="nav-users"><span class="ni">◉</span>User Management</a><a href="#history" onclick="go('history')" id="nav-history"><span class="ni">◷</span>History</a><a href="#profile" onclick="go('profile')" id="nav-profile"><span class="ni">⚙</span>Profile Management</a></nav><div class="sideuser"><div class="user"><div class="avatar" id="sideAvatar">GS</div><div><div class="uname" id="sideName">Gunjit Singh</div><div class="school" id="sideSchool">ABC Public School</div></div><button class="btn" style="margin-left:auto;padding:6px 8px" onclick="logout()">↪</button></div></div></aside><main class="main"><header class="header"><div><button class="hamb" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><span class="headtitle" id="pageTitle">Dashboard</span></div><div class="headright"><div class="profile"><div class="avatar" id="headAvatar">GS</div><span id="headName">Gunjit Singh</span></div></div></header><section id="view" class="content"></section></main><nav class="mobile-nav"><button onclick="go('dashboard')"><span class="mi">⌂</span>Dashboard</button><button onclick="go('classes')"><span class="mi">▦</span>Classes</button><button onclick="go('rooms')"><span class="mi">⌑</span>Rooms</button><button onclick="go('subjects')"><span class="mi">◈</span>Subjects</button></nav></div>`;const p=APP.profile;document.getElementById('sideName').textContent=p.full_name||'';document.getElementById('sideSchool').textContent=p.sc_schools?.name||'';document.getElementById('headName').textContent=p.full_name||'';const ini=(p.full_name||'SC').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();document.getElementById('sideAvatar').textContent=ini;document.getElementById('headAvatar').textContent=ini}

Quick Actions</h2></div><button class="quick" onclick="go('classes')"><span class="qicon">▦</span><span><b>Manage Classes</b><span>Add sections and student counts</span></span></button><button class="quick" onclick="go('rooms')"><span class="qicon">⌑</span><span><b>Manage Rooms</b><span>Set capacity and availability</span></span></button><button class="quick" onclick="go('subjects')"><span class="qicon">◈</span><span><b>Manage Subjects</b><span>Map subjects by class</span></span></button></div><div class="card"><div class="cardhead"><h2>Setup Progress</h2></div><div style="font-size:10px;color:#6d778b">Academics setup</div><div class="progress" style="margin:9px 0 6px"><div class="fill"></div></div><div style="font-size:9px;color:#6d778b">Classes, rooms and subjects</div></div></div></div>`}
async function loadDashboardStats(){const [c,s,r,sub]=await Promise.all([db.from('sc_classes').select('id',{count:'exact',head:true}).eq('school_id',APP.schoolId).eq('session_id',APP.sessionId),db.from('sc_sections').select('id',{count:'exact',head:true}).eq('school_id',APP.schoolId),db.from('sc_rooms').select('id',{count:'exact',head:true}).eq('school_id',APP.schoolId).eq('session_id',APP.sessionId),db.from('sc_subjects').select('id',{count:'exact',head:true}).eq('school_id',APP.schoolId).eq('session_id',APP.sessionId)]);document.getElementById('dashClasses').textContent=c.count??0;document.getElementById('dashSections').textContent=s.count??0;document.getElementById('dashRooms').textContent=r.count??0;document.getElementById('dashSubjects').textContent=sub.count??0}
function classesHtml(rows){return `<div class="top"><div><h1>Classes & Sections</h1><p>Define classes, sections and student counts for ${new Date().getFullYear()}–${String(new Date().getFullYear()+1).slice(-2)}.</p></div><div class="actions"><a class="btn" href="sample-files/SeatChart-Classes-Sample.xlsx" download>↓ DOWNLOAD SAMPLE FILE</a><label class="btn primary" for="classFile">↑ UPLOAD EXCEL FILE</label><input id="classFile" type="file" accept=".xlsx,.xls" style="display:none" onchange="handleImportFile(this,'classes')"><button class="btn primary" onclick="classModalDb()">+ ADD CLASS</button></div></div><div class="searchbar"><input placeholder="Search class..." oninput="filterRows(this,'classTable')"></div><div class="tablewrap"><table class="table" id="classTable"><thead><tr><th>Class</th><th>Sections</th><th>Students</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.map(r=>`<tr><td>Class ${r.class_number}</td><td>${r.sc_sections?.length||0}</td><td>${(r.sc_sections||[]).reduce((a,x)=>a+Number(x.student_count||0),0)}</td><td class="dotgood">Active</td><td class="actions-cell"><button class="btn" onclick="editClassDb('${r.id}')">Edit</button></td></tr>`).join('')}</tbody></table></div>`}
async function loadClasses(){const v=document.getElementById('view');v.innerHTML='<div class="card">Loading classes…</div>';const {data,error}=await db.from('sc_classes').select('*,sc_sections(*)').eq('school_id',APP.schoolId).eq('session_id',APP.sessionId).order('class_number');if(error)return v.innerHTML=`<div class="card error-note">${error.message}</div>`;v.innerHTML=classesHtml(data||[])}
function classModalDb(){openModal(`<div class="modalhead"><h2>Add Class</h2><button class="x" onclick="closeModal()">×</button></div><div class="split"><div class="field"><label>Class *</label><select id="dbClass">${Array.from({length:12},(_,i)=>`<option>${i+1}</option>`).join('')}</select></div><div class="field"><label>Number of Sections *</label><select id="dbSecCount">${Array.from({length:10},(_,i)=>`<option>${i+1}</option>`).join('')}</select></div></div><div id="secFields"></div><div style="text-align:right"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveClassDb()">SAVE CLASS</button></div>`);document.getElementById('dbSecCount').onchange=drawSectionFields;drawSectionFields()}
function drawSectionFields(){const n=Number(document.getElementById('dbSecCount').value);document.getElementById('secFields').innerHTML=Array.from({length:n},(_,i)=>`<div class="field"><label>Section ${String.fromCharCode(65+i)} — Number of Students</label><input id="student_${i}" type="number" min="0" value="0"></div>`).join('')}
async function saveClassDb(){const cls=Number(document.getElementById('dbClass').value),n=Number(document.getElementById('dbSecCount').value);let r=await db.from('sc_classes').upsert({school_id:APP.schoolId,session_id:APP.sessionId,class_number:cls},{onConflict:'school_id,session_id,class_number'}).select('id').single();if(r.error)return toast(r.error.message);for(let i=0;i<n;i++){const count=Number(document.getElementById('student_'+i).value||0);const e=await db.from('sc_sections').upsert({school_id:APP.schoolId,class_id:r.data.id,section_name:String.fromCharCode(65+i),student_count:count},{onConflict:'class_id,section_name'});if(e.error)return toast(e.error.message)}await logHistory('Created','Class',r.data.id,`Class ${cls}`);closeModal();toast('Class saved');loadClasses()}
async function editClassDb(id){const {data,error}=await db.from('sc_classes').select('*,sc_sections(*)').eq('id',id).single();if(error)return toast(error.message);openModal(`<div class="modalhead"><h2>Edit Class ${data.class_number}</h2><button class="x" onclick="closeModal()">×</button></div>${(data.sc_sections||[]).map(x=>`<div class="field"><label>Section ${x.section_name} — Number of Students</label><input id="edit_${x.id}" type="number" min="0" value="${x.student_count}"></div>`).join('')}<div style="text-align:right"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveEditedClass('${id}')">SAVE</button></div>`)}
async function saveEditedClass(id){const {data}=await db.from('sc_classes').select('sc_sections(*)').eq('id',id).single();for(const x of data.sc_sections){const e=await db.from('sc_sections').update({student_count:Number(document.getElementById('edit_'+x.id).value||0)}).eq('id',x.id);if(e.error)return toast(e.error.message)}await logHistory('Updated','Class',id,'Class student counts updated');closeModal();toast('Class updated');loadClasses()}
function roomsHtml(rows){return `<div class="top"><div><h1>Rooms</h1><p>Manage exam rooms, capacities and availability.</p></div><div class="actions"><a class="btn" href="sample-files/SeatChart-Rooms-Sample.xlsx" download>↓ DOWNLOAD SAMPLE FILE</a><label class="btn primary" for="roomFile">↑ UPLOAD EXCEL FILE</label><input id="roomFile" type="file" accept=".xlsx,.xls" style="display:none" onchange="handleImportFile(this,'rooms')"><button class="btn primary" onclick="roomModalDb()">+ ADD ROOM</button></div></div><div class="searchbar"><input placeholder="Search room..." oninput="filterRows(this,'roomTable')"></div><div class="tablewrap"><table class="table" id="roomTable"><thead><tr><th>Room</th><th>Room Number</th><th>Capacity</th><th>Floor</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.room_name}</td><td>${r.room_number||'—'}</td><td>${r.capacity}</td><td>${r.floor||'—'}</td><td class="${r.status==='Available'?'dotgood':''}">${r.status}</td><td class="actions-cell"><button class="btn" onclick="roomModalDb('${r.id}')">Edit</button></td></tr>`).join('')}</tbody></table></div>`}
async function loadRooms(){const v=document.getElementById('view');v.innerHTML='<div class="card">Loading rooms…</div>';const {data,error}=await db.from('sc_rooms').select('*').eq('school_id',APP.schoolId).eq('session_id',APP.sessionId).order('room_name');if(error)return v.innerHTML=`<div class="card error-note">${error.message}</div>`;v.innerHTML=roomsHtml(data||[])}
async function roomModalDb(id){let row=null;if(id){const r=await db.from('sc_rooms').select('*').eq('id',id).single();if(r.error)return toast(r.error.message);row=r.data}openModal(`<div class="modalhead"><h2>${row?'Edit':'Add'} Room</h2><button class="x" onclick="closeModal()">×</button></div><div class="field"><label>Room Name *</label><input id="rmName" value="${row?.room_name||''}"></div><div class="split"><div class="field"><label>Room Number</label><input id="rmNo" value="${row?.room_number||''}"></div><div class="field"><label>Capacity *</label><input id="rmCap" type="number" value="${row?.capacity||''}"></div></div><div class="field"><label>Floor</label><input id="rmFloor" value="${row?.floor||''}"></div><div class="field"><label>Status</label><select id="rmStatus"><option ${row?.status==='Available'?'selected':''}>Available</option><option ${row?.status==='Unavailable'?'selected':''}>Unavailable</option></select></div><div style="text-align:right"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveRoomDb('${id||''}')">SAVE ROOM</button></div>`)}
async function saveRoomDb(id){const payload={school_id:APP.schoolId,session_id:APP.sessionId,room_name:document.getElementById('rmName').value.trim(),room_number:document.getElementById('rmNo').value.trim(),capacity:Number(document.getElementById('rmCap').value),floor:document.getElementById('rmFloor').value.trim(),status:document.getElementById('rmStatus').value};if(!payload.room_name||!payload.capacity)return toast('Room name and capacity are required');let r=id?await db.from('sc_rooms').update(payload).eq('id',id):await db.from('sc_rooms').insert(payload);if(r.error)return toast(r.error.message);await logHistory(id?'Updated':'Created','Room',id||null,payload.room_name);closeModal();toast('Room saved');loadRooms()}
function subjectsHtml(rows){return `<div class="top"><div><h1>Subjects</h1><p>Maintain class-wise subjects and assign roll numbers by subject.</p></div><div class="actions"><button class="btn primary" onclick="subjectModalDb()">+ ADD SUBJECT</button></div></div><div class="searchbar"><input placeholder="Search subject..." oninput="filterRows(this,'subjectTable')"></div><div class="tablewrap"><table class="table" id="subjectTable"><thead><tr><th>Subject</th><th>Code</th><th>Class</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.subject_name}</td><td>${r.subject_code||'—'}</td><td>Class ${r.sc_classes?.class_number||'—'}</td><td class="${r.status==='Active'?'dotgood':''}">${r.status}</td><td class="actions-cell"><button class="btn" onclick="subjectModalDb('${r.id}',${r.sc_classes?.class_number||1})">Edit</button> <button class="btn" onclick="assignRollsDb('${r.id}',${r.sc_classes?.class_number||1},'${String(r.subject_name).replace(/'/g,"&#39;")}')">Rolls</button></td></tr>`).join('')}</tbody></table></div>`}
async function loadSubjects(){const v=document.getElementById('view');v.innerHTML='<div class="card">Loading subjects…</div>';const {data,error}=await db.from('sc_subjects').select('*,sc_classes(class_number)').eq('school_id',APP.schoolId).eq('session_id',APP.sessionId).order('subject_name');if(error)return v.innerHTML=`<div class="card error-note">${error.message}</div>`;v.innerHTML=subjectsHtml(data||[])}
async function subjectModalDb(id,classNo){let row=null;if(id){const r=await db.from('sc_subjects').select('*').eq('id',id).single();if(r.error)return toast(r.error.message);row=r.data}const classes=await db.from('sc_classes').select('id,class_number').eq('school_id',APP.schoolId).eq('session_id',APP.sessionId).order('class_number');openModal(`<div class="modalhead"><h2>${row?'Edit':'Add'} Subject</h2><button class="x" onclick="closeModal()">×</button></div><div class="split"><div class="field"><label>Class *</label><select id="subClass">${(classes.data||[]).map(c=>`<option value="${c.id}" ${c.class_number==classNo?'selected':''}>Class ${c.class_number}</option>`).join('')}</select></div><div class="field"><label>Subject *</label><input id="subName" value="${row?.subject_name||''}" placeholder="Mathematics"></div></div><div class="split"><div class="field"><label>Subject Code</label><input id="subCode" value="${row?.subject_code||''}" placeholder="MAT"></div><div class="field"><label>Status</label><select id="subStatus"><option ${row?.status!=='Inactive'?'selected':''}>Active</option><option ${row?.status==='Inactive'?'selected':''}>Inactive</option></select></div></div><div style="text-align:right"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveSubjectDb('${id||''}')">SAVE SUBJECT</button></div>`)}
async function saveSubjectDb(id){const payload={school_id:APP.schoolId,session_id:APP.sessionId,class_id:document.getElementById('subClass').value,subject_name:document.getElementById('subName').value.trim(),subject_code:document.getElementById('subCode').value.trim(),status:document.getElementById('subStatus').value};if(!payload.class_id||!payload.subject_name)return toast('Class and subject are required');let r=id?await db.from('sc_subjects').update(payload).eq('id',id):await db.from('sc_subjects').insert(payload);if(r.error)return toast(r.error.message);await logHistory(id?'Updated':'Created','Subject',id||null,payload.subject_name);closeModal();toast('Subject saved');loadSubjects()}
async function assignRollsDb(subjectId,classNo,subjectName){const sr=await db.from('sc_subjects').select('class_id').eq('id',subjectId).single();if(sr.error)return toast(sr.error.message);const sections=await db.from('sc_sections').select('id,section_name,student_count').eq('class_id',sr.data.class_id).order('section_name');if(sections.error)return toast(sections.error.message);const existing=await db.from('sc_subject_rolls').select('section_id,roll_number').eq('subject_id',subjectId);const selected=new Set((existing.data||[]).map(x=>`${x.section_id}:${x.roll_number}`));openModal(`<div class="modalhead"><h2>Assign Roll Numbers</h2><button class="x" onclick="closeModal()">×</button></div><p>Choose the students appearing for <b>${subjectName}</b>. Rolls are generated from each section's student count.</p>${(sections.data||[]).map(sec=>`<div class="section"><div class="sectitle">SECTION ${sec.section_name} — ${sec.student_count} STUDENTS</div><div class="roll-tools"><button class="btn" onclick="setSectionRolls('${sec.id}',true)">✓ SELECT ALL</button><button class="btn" onclick="setSectionRolls('${sec.id}',false)">× DESELECT ALL</button></div><div class="roll-grid">${Array.from({length:sec.student_count},(_,i)=>{const n=i+1,ck=selected.has(`${sec.id}:${n}`)?'checked':'';return `<div class="roll-check"><input type="checkbox" class="subjectRollBox" data-section="${sec.id}" value="${n}" ${ck}><label onclick="this.previousElementSibling.click()">${n}</label></div>`}).join('')}</div></div>`).join('')}<div style="text-align:right;margin-top:18px"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveRollsDb('${subjectId}')">SAVE ASSIGNMENTS</button></div>`)}
function setSectionRolls(sectionId,selected){document.querySelectorAll(`.subjectRollBox[data-section="${sectionId}"]`).forEach(x=>x.checked=selected)}
async function saveRollsDb(subjectId){const del=await db.from('sc_subject_rolls').delete().eq('subject_id',subjectId);if(del.error)return toast(del.error.message);const boxes=[...document.querySelectorAll('.subjectRollBox:checked')];if(boxes.length){const rows=boxes.map(x=>({school_id:APP.schoolId,subject_id:subjectId,section_id:x.dataset.section,roll_number:Number(x.value)}));const ins=await db.from('sc_subject_rolls').insert(rows);if(ins.error)return toast(ins.error.message)}await logHistory('Updated','Subject Roll Assignment',subjectId,'Subject roll numbers updated');closeModal();toast('Roll assignments saved');loadSubjects()}
function plannerHtml(){return `<div class="top"><div><h1>Exam Planner</h1><p>Examination planning will be activated in the next module phase.</p></div></div><div class="card"><div class="cardhead"><h2>Planner</h2><span class="badge">Academics focus</span></div><p style="font-size:11px;color:#6d778b">The examination workflow is intentionally deferred while Classes, Rooms, Subjects and Roll Assignment are finalized.</p></div>`}
function examsHtml(){return `<div class="top"><div><h1>Exams</h1><p>Examination setup is reserved for the next development phase.</p></div></div><div class="card"><div class="cardhead"><h2>Exams</h2></div><p style="font-size:11px;color:#6d778b">No examination records are being created in the current Academics release.</p></div>`}
function usersHtml(){return `<div class="top"><div><h1>User Management</h1><p>Users belong to a single school tenant.</p></div></div><div class="card"><div class="cardhead"><h2>Current User</h2></div><div class="tablewrap"><table class="table"><tr><th>Name</th><th>Phone</th><th>Role</th></tr><tr><td>${APP.profile?.full_name||''}</td><td>${APP.profile?.phone||''}</td><td>${APP.profile?.role||''}</td></tr></table></div></div>`}
async function loadHistory(){const v=document.getElementById('view');v.innerHTML='<div class="card">Loading history…</div>';const {data,error}=await db.from('sc_history').select('*').eq('school_id',APP.schoolId).order('created_at',{ascending:false}).limit(50);if(error)return v.innerHTML=`<div class="card error-note">${error.message}</div>`;v.innerHTML=`<div class="top"><div><h1>History</h1><p>Recent academic setup actions for this school.</p></div></div><div class="card"><div class="timeline">${(data||[]).map(x=>`<div class="event"><time>${new Date(x.created_at).toLocaleString()}</time><b>${x.action} ${x.entity_type}</b><span>${x.description||''}</span></div>`).join('')||'<div class="event"><span>No history yet.</span></div>'}</div></div>`}
function profileHtml(){return `<div class="top"><div><h1>Profile Management</h1><p>School and administrator profile.</p></div></div><div class="card"><div class="split"><div><div class="label">Administrator</div><div class="metric" style="font-size:20px">${APP.profile?.full_name||''}</div><div class="note">${APP.profile?.phone||''}</div></div><div><div class="label">School</div><div class="metric" style="font-size:20px">${APP.profile?.sc_schools?.name||''}</div><div class="note">${APP.profile?.sc_schools?.address||'No address set'}</div></div></div></div>`}
function filterRows(input,id){const q=input.value.toLowerCase();document.querySelectorAll(`#${id} tbody tr`).forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalbg').style.display='flex'}function closeModal(){document.getElementById('modalbg').style.display='none'}
async function handleImportFile(input,type){const file=input.files&&input.files[0];if(!file)return;const label=type==='classes'?'Classes & Sections':'Rooms';const reader=new FileReader();reader.onload=async e=>{try{const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});if(!rows.length)throw new Error('The Excel file has no data rows.');window.pendingImport={type,fileName:file.name,rows};openModal(`<div class="modalhead"><h2>Confirm Import</h2><button class="x" onclick="closeModal()">×</button></div><p>You selected <b>${file.name}</b>.</p><p><b>${rows.length}</b> records were detected for ${label}.</p><div style="text-align:right"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="confirmImportDb()">CONFIRM IMPORT</button></div>`)}catch(err){toast(err.message||'Could not read Excel file')}};reader.readAsArrayBuffer(file)}
async function confirmImportDb(){const imp=window.pendingImport;if(!imp)return;try{if(imp.type==='classes')await importClasses(imp.rows);else await importRooms(imp.rows);closeModal();toast('Import completed');go(imp.type==='classes'?'classes':'rooms')}catch(e){toast(e.message||'Import failed')}}
async function importClasses(rows){for(const r of rows){const cls=Number(r.Class||r.class||r['Class Number']);const section=String(r.Section||r.section||'').trim();const count=Number(r['Student Count']||r.student_count||r.Students||0);if(!cls||!section||count<0)throw new Error('Classes file requires Class, Section and Student Count.');let {data:c,error}=await db.from('sc_classes').select('id').eq('school_id',APP.schoolId).eq('session_id',APP.sessionId).eq('class_number',cls).maybeSingle();if(error)throw error;if(!c){({data:c,error}=await db.from('sc_classes').insert({school_id:APP.schoolId,session_id:APP.sessionId,class_number:cls}).select('id').single());if(error)throw error}const {error:e2}=await db.from('sc_sections').upsert({school_id:APP.schoolId,class_id:c.id,section_name:section,student_count:count},{onConflict:'class_id,section_name'});if(e2)throw e2}await logHistory('Imported','Classes',null,'Excel class import')}
async function importRooms(rows){for(const r of rows){const roomName=String(r['Room Name']||r.room_name||r.Room||'').trim();if(!roomName)throw new Error('Rooms file requires Room Name.');const payload={school_id:APP.schoolId,session_id:APP.sessionId,room_name:roomName,room_number:String(r['Room Number']||r.room_number||''),capacity:Number(r.Capacity||r.capacity||0),floor:String(r.Floor||r.floor||''),status:String(r.Status||r.status||'Available')};if(!payload.capacity)throw new Error('Every room needs a capacity.');const {error}=await db.from('sc_rooms').insert(payload);if(error)throw error}await logHistory('Imported','Rooms',null,'Excel room import')}
async function logout(){await db.auth.signOut();location.reload()}
async function logHistory(action,type,id,description){try{await db.from('sc_history').insert({school_id:APP.schoolId,user_id:APP.user.id,action,entity_type:type,entity_id:id||null,description})}catch(e){}}
document.getElementById('modalbg').onclick=e=>{if(e.target.id==='modalbg')closeModal()};
window.addEventListener('load',async()=>{const {data:{user}}=await db.auth.getUser();if(user){await bootstrap()}else{showAuth('login')}});
</script>
