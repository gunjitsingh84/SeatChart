ctions</th></tr></thead><tbody>${(rows||[]).map(r=>`<tr data-room-status="${r.status}"><td><b>${r.room_number}</b></td><td>${r.room_name||'—'}</td><td>${r.capacity?String(r.capacity)+' benches / '+String(Number(r.capacity)*2)+' students':'—'}</td><td>${r.floor||'—'}</td><td class="${r.status==='Available'?'dotgood':''}">${r.status}</td><td class="actions-cell"><button class="btn" onclick="roomModalDb('${r.id}')">Edit</button><button class="btn danger" style="margin-left:5px" onclick="deleteRoomDb('${r.id}','${String(r.room_name||r.room_number).replace(/'/g,"&#39;")}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="5" style="text-align:center;color:#6d778b;padding:25px">No rooms configured yet.</td></tr>'}</tbody></table></div>`}

async function loadSubjectRollCountsDb(){
  const assignedBySubject=new Map();
  const pageSize=1000;
  let from=0;
  while(true){
    const result=await db.from('sc_subject_rolls')
      .select('subject_id')
      .eq('school_id',APP.schoolId)
      .range(from,from+pageSize-1);
    if(result.error)throw result.error;
    const rows=result.data||[];
    rows.forEach(x=>assignedBySubject.set(x.subject_id,(assignedBySubject.get(x.subject_id)||0)+1));
    if(rows.length<pageSize)break;
    from+=pageSize;
  }
  return assignedBySubject;
}

async function loadSubjects(){
  const v=document.getElementById('view');
  v.innerHTML='<div class="card">Loading subjects…</div>';

    const [subjectsRes,sectionsRes,assignedBySubject]=await Promise.all([
      db.from('sc_subjects').select('*,sc_classes(class_number)').eq('school_id',APP.schoolId).eq('session_id',APP.sessionId).order('subject_name'),
      db.from('sc_sections').select('id,class_id,student_count').eq('school_id',APP.schoolId),
      loadSubjectRollCountsDb()
    ]);
    if(subjectsRes.error)throw subjectsRes.error;
    if(sectionsRes.error)throw sectionsRes.error;
    const sorted=(subjectsRes.data||[]).map(r=>{
      const sections=(sectionsRes.data||[]).filter(x=>x.class_id===r.class_id);
      return {

async function initializeSubjectRollsDb(subjectId,classId){
  const sections=await db.from('sc_sections').select('id,student_count').eq('school_id',APP.schoolId).eq('class_id',classId);
  if(sections.error)throw sections.error;
  const existing=await db.from('sc_subject_rolls').select('section_id,roll_number').eq('school_id',APP.schoolId).eq('subject_id',subjectId);
  if(existing.error)throw existing.error;
  const existingKeys=new Set((existing.data||[]).map(x=>x.section_id+'|'+x.roll_number));
  const additions=[];
  (sections.data||[]).forEach(section=>{
    for(let roll=1;roll<=Number(section.student_count||0);roll++){
      const key=section.id+'|'+roll;
      if(!existingKeys.has(key))additions.push({school_id:APP.schoolId,subject_id:subjectId,section_id:section.id,roll_number:roll});
    }
  });
  if(additions.length){
    const result=await db.from('sc_subject_rolls').insert(additions);
    if(result.error)throw result.error;
  }
  return additions.length;
}

async function assignRollsDb(subjectId,classNo,subjectName){

    ]);

    if(!sections.length)return toast('No sections are configured for Class '+classNo+'.');

    existing.forEach(x=>{
      if(!savedBySection.has(x.section_id))savedBySection.set(x.section_id,new Set());
      savedBySection.get(x.section_id).add(Number(x.roll_number));
    });
    window.rollAssignmentState={subjectId,classNo,subjectName,sections,selected:new Map()};

      const selected=new Set();

        for(let roll=1;roll<=count;roll++)selected.add(roll);
      }else if(saved){
        saved.forEach(roll=>{
          if(roll>=1&&roll<=count)selected.add(roll);
        });
      }
      window.rollAssignmentState.selected.set(section.id,selected);
    });
    renderAssignRollsModal();
  }catch(e){console.error('assignRollsDb failed',e);toast(e.message||'Unable to load roll assignments')}

function plannerEscape(v){
  return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function plannerDateKey(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function plannerLocalDate(value){const p=String(value).split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function plannerDateLabel(value){return plannerLocalDate(value).toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'})}
function plannerDayName(value){return plannerLocalDate(value).toLocaleDateString(undefined,{weekday:'short'})}
function plannerIsSecondSaturday(value){
  const d=plannerLocalDate(value);
  return d.getDay()===6 && d.getDate()>=8 && d.getDate()<=14;
}
function plannerAvailableDates(startDate,endDate,includeSaturdays,breakSet){
  const dates=[],d=plannerLocalDate(startDate),end=plannerLocalDate(endDate);
  while(d<=end){
    const key=plannerDateKey(d),day=d.getDay();
    const excludedSunday=day===0;
    const excludedSaturday=day===6 && (!includeSaturdays||plannerIsSecondSaturday(key));
    if(!excludedSunday&&!excludedSaturday&&!breakSet.has(key))dates.push(key);
    d.setDate(d.getDate()+1);
  }
  return dates;
}
function plannerSpacedDates(available,count,gap){
  if(count<=0)return[];
  const dates=[];
  let cursor=0;
  for(let i=0;i<count;i++){
    if(cursor>=available.length)return null;
    const examDate=available[cursor];
    const examDay=plannerLocalDate(examDate).getDay();
    if(examDay===0)return null;
    dates.push(examDate);
    cursor+=gap+1;
  }
  return dates;
}
function plannerShuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}

async function generateExamPlannerDb(){
  const d=window.examPlannerDraft;if(!d)return;
  const name=document.getElementById('plannerExamName')?.value.trim();
  const start=document.getElementById('plannerStartDate')?.value,end=document.getElementById('plannerEndDate')?.value;
  const today=plannerTodayKey(),studyLeaveDays=Math.max(0,Math.min(10,Number(document.getElementById('plannerStudyLeaveDays')?.value||0)));
  const startTime=document.getElementById('plannerStartTime')?.value,endTime=document.getElementById('plannerEndTime')?.value;
  const includeSaturdays=!!document.getElementById('plannerIncludeSaturdays')?.checked;
  if(!name)return toast('Exam Name is required.');
  if(!start||!end)return toast('Start Date and End Date are required.');
  if(start<today)return toast('Start Date cannot be earlier than today.');
  if(end<start)return toast('End Date must be on or after Start Date.');
  if(!startTime||!endTime||endTime<=startTime)return toast('Paper End Time must be after Start Time.');
  if(!d.selectedClasses.size)return toast('Select at least one class.');
  if(!d.selectedSubjects.size)return toast('Select at least one subject.');

  if(!available.length)return toast('No available examination dates match the selected planning rules.');

  const byClass=new Map();
  selectedSubjects.forEach(s=>{if(!byClass.has(s.class_id))byClass.set(s.class_id,[]);byClass.get(s.class_id).push(s)});
  const assignments=[];
  for(const [classId,subs] of byClass){
    const dates=plannerSpacedDates(available,subs.length,studyLeaveDays);
    if(!dates)return toast(`Class ${d.classes.find(c=>c.id===classId)?.class_number||''} has ${subs.length} selected subjects but the selected exam period does not allow ${studyLeaveDays} study-leave day${studyLeaveDays===1?'':'s'} between every exam.`);
    const subjects=plannerShuffle(subs);
    subjects.forEach((subject,index)=>assignments.push({class_id:subject.class_id,subject_id:subject.id,exam_date:dates[index]}));
  }
  try{
    const examInsert=await db.from('sc_exams').insert({school_id:APP.schoolId,session_id:APP.sessionId,exam_name:name,start_date:start,end_date:end,paper_start_time:startTime,paper_end_time:endTime,include_saturdays:includeSaturdays,study_leave_days:studyLeaveDays,status:'Draft'}).select('id').single();
    if(examInsert.error)throw examInsert.error;
    const examId=examInsert.data.id;
    const scheduleRows=assignments.map(x=>({school_id:APP.schoolId,exam_id:examId,class_id:x.class_id,subject_id:x.subject_id,exam_date:x.exam_date}));
    const sr=await db.from('sc_exam_schedules').insert(scheduleRows);if(sr.error)throw sr.error;

    closeModal();window.examPlannerDraft=null;toast('Exam plan generated');await openExamCalendarDb(examId);
  }catch(e){console.error('generateExamPlannerDb failed',e);toast(e.message||'Unable to generate exam plan')}
}

function examCalendarValidation(){
  const p=window.activeExamPlanner;if(!p)return{conflicts:new Set(),messages:[]};
  const byClassDate=new Map(),conflicts=new Set(),messages=[],validDatesArray=plannerAvailableDates(p.exam.start_date,p.exam.end_date,p.exam.include_saturdays,new Set(p.breaks.map(x=>x.break_date))),validDates=new Set(validDatesArray);
  p.schedules.forEach(x=>{
    const key=x.class_id+'|'+x.exam_date;
    if(!byClassDate.has(key))byClassDate.set(key,[]);
    byClassDate.get(key).push(x);
    if(x.exam_date<p.exam.start_date||x.exam_date>p.exam.end_date){conflicts.add(x.id);messages.push('An exam is outside the examination period.')}
    else if(!validDates.has(x.exam_date)){conflicts.add(x.id);messages.push('An exam is scheduled on an excluded date: '+plannerDateLabel(x.exam_date)+'.')}
  });
  byClassDate.forEach((items,key)=>{if(items.length>1){items.forEach(x=>conflicts.add(x.id));const [classId,date]=key.split('|');const cls=p.classes.find(c=>c.id===classId);messages.push(`Class ${cls?.class_number||''} has ${items.length} exams on ${plannerDateLabel(date)}.`)}});
  const studyLeaveDays=Math.max(0,Number(p.exam.study_leave_days||0)),dateIndex=new Map(validDatesArray.map((date,index)=>[date,index]));
  const schedulesByClass=new Map();p.schedules.forEach(x=>{if(!schedulesByClass.has(x.class_id))schedulesByClass.set(x.class_id,[]);schedulesByClass.get(x.class_id).push(x)});
  schedulesByClass.forEach((items,classId)=>{const ordered=[...items].filter(x=>dateIndex.has(x.exam_date)).sort((a,b)=>dateIndex.get(a.exam_date)-dateIndex.get(b.exam_date));for(let i=1;i<ordered.length;i++){const gap=dateIndex.get(ordered[i].exam_date)-dateIndex.get(ordered[i-1].exam_date)-1;if(gap!==studyLeaveDays){conflicts.add(ordered[i-1].id);conflicts.add(ordered[i].id);const cls=p.classes.find(c=>c.id===classId);messages.push(`Class ${cls?.class_number||''} must have exactly ${studyLeaveDays} study-leave day${studyLeaveDays===1?'':'s'} between exams.`)}}});
  return{conflicts,messages:[...new Set(messages)]};
}

async function dropPlannerExam(e,date){
  e.preventDefault();const id=e.dataTransfer.getData('text/plain'),p=window.activeExamPlanner;if(!id||!p)return;
  if(date<p.exam.start_date||date>p.exam.end_date)return toast('Exam must remain within the examination period.');
  const breakDates=new Set(p.breaks.map(x=>x.break_date));if(!plannerAvailableDates(p.exam.start_date,p.exam.end_date,p.exam.include_saturdays,breakDates).includes(date))return toast('This date is excluded from examination planning.');
  const row=p.schedules.find(x=>x.id===id);if(!row)return;
  const conflict=p.schedules.some(x=>x.id!==id&&x.class_id===row.class_id&&x.exam_date===date);
  if(conflict&&!confirm('This class already has an exam on '+plannerDateLabel(date)+'. Move it anyway and highlight the conflict?'))return;
  const result=await db.from('sc_exam_schedules').update({exam_date:date}).eq('id',id).eq('school_id',APP.schoolId).eq('exam_id',p.exam.id);
  if(result.error)return toast(result.error.message);
  row.exam_date=date;await logHistory('Updated','Exam Schedule',id,'Exam moved to '+plannerDateLabel(date));renderExamCalendar();
}

  <p>Changes to dates and planning rules do not automatically regenerate the existing calendar.</p>
  <div class="split"><div class="field"><label>Start Date</label><input id="editExamStart" type="date" min="${plannerTodayKey()}" value="${e.start_date}" onchange="syncEditExamEndDateMin()"></div><div class="field"><label>End Date</label><input id="editExamEnd" type="date" min="${e.start_date||plannerTodayKey()}" value="${e.end_date}"></div></div>
  <div class="split"><div class="field"><label>Paper Start Time</label><input id="editExamStartTime" type="time" value="${String(e.paper_start_time).slice(0,5)}"></div><div class="field"><label>Paper End Time</label><input id="editExamEndTime" type="time" value="${String(e.paper_end_time).slice(0,5)}"></div></div>
  <div class="field"><label>Study Leave Between Exams</label><select id="editExamStudyLeave">${Array.from({length:11},(_,i)=>`<option value="${i}" ${Number(e.study_leave_days||0)===i?'selected':''}>${i} day${i===1?'':'s'}</option>`).join('')}</select><div class="note">The selected number of study-leave days is enforced between exams for each class.</div></div>
  <label class="check"><input id="editExamSaturday" type="checkbox" ${e.include_saturdays?'checked':''}> Include Saturdays (2nd Saturday remains excluded)</label>
  <div style="text-align:right;margin-top:18px"><button class="btn" onclick="closeModal()">CANCEL</button><button class="btn primary" onclick="saveExamSettingsDb()">SAVE</button></div>`);
}
async function syncEditExamEndDateMin(){const start=document.getElementById('editExamStart')?.value||plannerTodayKey(),end=document.getElementById('editExamEnd');if(!end)return;end.min=start;if(end.value&&end.value<start)end.value=start}
async function saveExamSettingsDb(){
  const p=window.activeExamPlanner;if(!p)return;
  const start=document.getElementById('editExamStart').value,end=document.getElementById('editExamEnd').value,st=document.getElementById('editExamStartTime').value,et=document.getElementById('editExamEndTime').value,inc=document.getElementById('editExamSaturday').checked,studyLeaveDays=Math.max(0,Math.min(10,Number(document.getElementById('editExamStudyLeave').value||0)));
  if(!start||!end||start<plannerTodayKey()||end<start)return toast('Invalid examination dates.');
  if(!st||!et||et<=st)return toast('Paper End Time must be after Start Time.');
  const result=await db.from('sc_exams').update({start_date:start,end_date:end,paper_start_time:st,paper_end_time:et,include_saturdays:inc,study_leave_days:studyLeaveDays}).eq('id',p.exam.id).eq('school_id',APP.schoolId);
  if(result.error)return toast(result.error.message);
  closeModal();await openExamCalendarDb(p.exam.id);toast('Planning rules updated');
}
async function deleteExamPlannerDb(id,name){
  if(!confirm('Delete '+name+' and its exam plan? This cannot be undone.'))return;
  const result=await db.from('sc_exams').delete().eq('id',id).eq('school_id',APP.schoolId).eq('session_id',APP.sessionId);
  if(result.error)return toast(result.error.message);
  await logHistory('Deleted','Exam',id,name+' exam plan deleted');toast('Exam deleted');loadPlanner();
}

async function loadExams(){
  const v=document.getElementById('view');
  v.innerHTML='<div class="card">Loading examinations…</div>';
  try{
    const [examRes,scheduleRes]=await Promise.all([
      db.from('sc_exams').select('*').eq('school_id',APP.schoolId).eq('session_id',APP.sessionId).order('start_date',{ascending:false}),
      db.from('sc_exam_schedules').select('id,exam_id,class_id,subject_id,exam_date').eq('school_id',APP.schoolId)
    ]);
    if(examRes.error)throw examRes.error;
    if(scheduleRes.error)throw scheduleRes.error;
    const exams=examRes.data||[],schedules=scheduleRes.data||[];
    const scheduleMap=new Map();
    schedules.forEach(x=>{
      if(!scheduleMap.has(x.exam_id))scheduleMap.set(x.exam_id,[]);
      scheduleMap.get(x.exam_id).push(x);
    });
    v.innerHTML=examsHtml(exams,scheduleMap);
  }catch(e){
    console.error('loadExams failed',e);
    v.innerHTML='<div class="card error-note">'+plannerEscape(e.message||'Unable to load examinations')+'</div>';
  }
}
function examStatusBadge(status){
  const s=String(status||'Draft');
  const styles={
    Published:'background:#eef8f2;color:#218653',
    Completed:'background:#f0f1f4;color:#596579',
    Draft:'background:#fff7e8;color:#a66b00'
  };
  return '<span class="badge" style="'+(styles[s]||styles.Draft)+'">'+plannerEscape(s)+'</span>';
}
async function openExamFromExams(examId){
  const v=document.getElementById('view');
  v.innerHTML='<div class="card">Loading examination…</div>';
  try{
    const [examRes,scheduleRes,classRes,subjectRes]=await Promise.all([
      db.from('sc_exams').select('*').eq('id',examId).eq('school_id',APP.schoolId).eq('session_id',APP.sessionId).single(),
      db.from('sc_exam_schedules').select('id,class_id,subject_id,exam_date').eq('exam_id',examId).eq('school_id',APP.schoolId),
      db.from('sc_classes').select('id,class_number').eq('school_id',APP.schoolId).eq('session_id',APP.sessionId),
      db.from('sc_subjects').select('id,class_id,subject_name').eq('school_id',APP.schoolId).eq('session_id',APP.sessionId)
    ]);
    if(examRes.error)throw examRes.error;
    if(scheduleRes.error)throw scheduleRes.error;
    if(classRes.error)throw classRes.error;
    if(subjectRes.error)throw subjectRes.error;
    const exam=examRes.data,schedules=scheduleRes.data||[],classes=classRes.data||[],subjects=subjectRes.data||[];
    const classMap=new Map(classes.map(x=>[x.id,x]));
    const subjectMap=new Map(subjects.map(x=>[x.id,x]));
    const classIds=[...new Set(schedules.map(x=>x.class_id))];
    const subjectIds=[...new Set(schedules.map(x=>x.subject_id))];
    const dates=[...new Set(schedules.map(x=>x.exam_date))].sort();
    const grouped=new Map();
    schedules.forEach(x=>{
      const key=x.exam_date+'|'+x.class_id;
      if(!grouped.has(key))grouped.set(key,[]);
      grouped.get(key).push(x);
    });
    v.innerHTML='<div class="top"><div><h1>'+plannerEscape(exam.exam_name)+'</h1><p>'+plannerDateLabel(exam.start_date)+' – '+plannerDateLabel(exam.end_date)+' · '+String(exam.paper_start_time).slice(0,5)+' – '+String(exam.paper_end_time).slice(0,5)+'</p></div><div class="actions"><button class="btn" onclick="loadExams()">← EXAMS</button>'+(exam.status==='Published'?'<button class="btn primary" onclick="openExamCalendarDb(\''+exam.id+'\')">VIEW PLANNER</button>':'<button class="btn primary" onclick="openExamCalendarDb(\''+exam.id+'\')">OPEN PLAN</button>')+'</div></div>'+
    '<div class="cards"><div class="card"><div class="label">Status</div><div style="margin-top:12px">'+examStatusBadge(exam.status)+'</div></div><div class="card"><div class="label">Classes</div><div class="metric">'+classIds.length+'</div><div class="note">Classes in exam plan</div></div><div class="card"><div class="label">Papers</div><div class="metric">'+schedules.length+'</div><div class="note">Class + subject entries</div></div><div class="card"><div class="label">Exam Days</div><div class="metric">'+dates.length+'</div><div class="note">Scheduled paper dates</div></div></div>'+
    '<div class="card"><div class="cardhead"><h2>Examination Schedule</h2><span class="note">'+subjectIds.length+' subjects scheduled</span></div><div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Day</th><th>Class</th><th>Subject</th></tr></thead><tbody>'+schedules.slice().sort((a,b)=>a.exam_date.localeCompare(b.exam_date)||Number(classMap.get(a.class_id)?.class_number||0)-Number(classMap.get(b.class_id)?.class_number||0)).map(x=>'<tr><td>'+plannerDateLabel(x.exam_date)+'</td><td>'+plannerDayName(x.exam_date)+'</td><td>Class '+plannerEscape(classMap.get(x.class_id)?.class_number||'—')+'</td><td>'+plannerEscape(subjectMap.get(x.subject_id)?.subject_name||'—')+'</td></tr>').join('')+'</tbody></table></div></div>';
  }catch(e){
    console.error('openExamFromExams failed',e);
    v.innerHTML='<div class="card error-note">'+plannerEscape(e.message||'Unable to open examination')+'</div>';
  }
}
function examsHtml(exams=[],scheduleMap=new Map()){
  const total=exams.length,published=exams.filter(x=>x.status==='Published').length,upcoming=exams.filter(x=>x.status==='Published'&&x.start_date>=plannerTodayKey()).length,completed=exams.filter(x=>x.status==='Completed').length;
  return '<div class="top"><div><h1>Exams</h1><p>Manage examinations created through the Exam Planner.</p></div></div>'+
  '<div class="cards"><div class="card"><div class="label">Total Exams</div><div class="metric">'+total+'</div><div class="note">Current academic session</div></div><div class="card"><div class="label">Published</div><div class="metric">'+published+'</div><div class="note">Ready for exam operations</div></div><div class="card"><div class="label">Upcoming</div><div class="metric">'+upcoming+'</div><div class="note">Published examinations</div></div><div class="card"><div class="label">Completed</div><div class="metric">'+completed+'</div><div class="note">Completed examinations</div></div></div>'+
  '<div class="card"><div class="cardhead"><h2>Examinations</h2><button class="btn" onclick="go(\'planner\')">OPEN EXAM PLANNER</button></div>'+
  (exams.length?'<div class="tablewrap"><table class="table"><thead><tr><th>Examination</th><th>Period</th><th>Papers</th><th>Classes</th><th>Status</th><th>Action</th></tr></thead><tbody>'+exams.map(ex=>{
    const rows=scheduleMap.get(ex.id)||[];
    const classes=new Set(rows.map(x=>x.class_id));
    return '<tr><td><b>'+plannerEscape(ex.exam_name)+'</b></td><td>'+plannerDateLabel(ex.start_date)+' – '+plannerDateLabel(ex.end_date)+'</td><td>'+rows.length+'</td><td>'+classes.size+'</td><td>'+examStatusBadge(ex.status)+'</td><td class="actions-cell"><button class="btn primary" onclick="openExamFromExams(\''+ex.id+'\')">OPEN</button></td></tr>';
  }).join('')+'</tbody></table></div>':'<div class="planner-empty">No examinations have been created for the current academic session yet. Create one from Exam Planner.</div>')+
  '</div>';
}
return `<div class="top"><div><h1>Exams</h1><p>Examination setup is reserved for the next development phase.</p></div></div><div class="card"><div class="cardhead"><h2>Exams</h2></div><p style="font-size:11px;color:#6d778b">No examination records are being created in the current Academics release.</p></div>`}
function usersHtml(){return `<div class="top"><div><h1>User Management</h1><p>Users belong to a single school tenant.</p></div></div><div class="card"><div class="cardhead"><h2>Current User</h2></div><div class="tablewrap"><table class="table"><tr><th>Name</th><th>Phone</th><th>Role</th></tr><tr><td>${APP.profile?.full_name||''}</td><td>${APP.profile?.phone||''}</td><td>${APP.profile?.role||''}</td></tr></table></div></div>`}
async function loadHistory(){const v=document.getElementById('view');v.innerHTML='<div class="card">Loading history…</div>';const {data,error}=await db.from('sc_history').select('*').eq('school_id',APP.schoolId).order('created_at',{ascending:false}).limit(50);if(error)return v.innerHTML=`<div class="card error-note">${error.message}</div>`;v.innerHTML=`<div class="top"><div><h1>History</h1><p>Recent academic setup actions for this school.</p></div></div><div class="card"><div class="timeline">${(data||[]).map(x=>`<div class="event"><time>${new Date(x.created_at).toLocaleString()}</time><b>${x.action} ${x.entity_type}</b><span>${x.description||''}</span></div>`).join('')||'<div class="event"><span>No history yet.</span></div>'}</div></div>`}
function profileHtml(){return `<div class="top"><div><h1>Profile Management</h1><p>School and administrator profile.</p></div></div><div class="card"><div class="split"><div><div class="label">Administrator</div><div class="metric" style="font-size:20px">${APP.profile?.full_name||''}</div><div class="note">${APP.profile?.phone||''}</div></div><div><div class="label">School</div><div class="metric" style="font-size:20px">${APP.profile?.sc_schools?.name||''}</div><div class="note">${APP.profile?.sc_schools?.address||'No address set'}</div></div></div></div>`}
function filterRows(input,id){const q=input.value.toLowerCase();document.querySelectorAll(`#${id} tbody tr`).forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
function toast(msg){const t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.style.display='block';clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.style.display='none',2800)}
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalbg').style.display='flex'}function closeModal(){document.getElementById('modalbg').style.display='none'}
async function handleImportFile(input,type){const file=input.files&&input.files[0];if(!file)return;const label=type==='classes'?'Classes & Sections':type==='rooms'?'Rooms':'Subjects';const reader=new FileReader();reader.onload=async e=>{try{if(!window.XLSX)throw new Error('Excel library is still loading. Please try again.');const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});if(!wb.SheetNames.length)throw new Error('The Excel file has no worksheets.');const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});if(!rows.length)throw new Error('The Excel file has no data rows.');if(type==='classes')validateClassImportRows(rows);if(type==='subjects')validateSubjectImportRows(rows);let overwriteCount=0,newCount=rows.length;if(type==='rooms'){validateRoomImportRows(rows);const existing=await db.from('sc_rooms').select('id,room_number').eq('school_id',APP.schoolId).eq('session_id',APP.sessionId);if(existing.error)throw existing.error;const existingNumbers=new Set((existing.data||[]).filter(x=>x.room_number).map(x=>x.room_number.trim().toLowerCase()));overwriteCount=rows.filter(r=>{const number=String(r['Room Number']??r.room_number??r.Room??'').trim().toLowerCase();return existingNumbers.has(number)}).length;newCount=rows.length-overwriteCount}if(type==='subjects'){const classes=await db.from('sc_classes').select('id,class_number').eq('school_id',APP.schoolId).eq('session_id',APP.sessionId);if(classes.error)throw classes.error;const classMap=new Map((classes.data||[]).map(x=>[Number(x.class_number),x.id]));const existing=await db.from('sc_subjects').select('id,class_id,subject_name').eq('school_id',APP.schoolId).eq('session_id',APP.sessionId);if(existing.error)throw existing.error;const keys=new Set((existing.data||[]).map(x=>x.class_id+'|'+String(x.subject_name||'').trim().toLowerCase()));overwriteCount=rows.filter(r=>{const cls=Number(r.Class??r.class??r['Class Number']),name=String(r.Subject??r.subject??r['Subject Name']??'').trim().toLowerCase();return keys.has(classMap.get(cls)+'|'+name)}).length;newCount=rows.length-overwriteCount}window.pendingImport={type,fileName:file.name,rows,overwriteCount,newCount};let details='';if(type==='rooms'){details='<p><b>'+rows.length+'</b> room records were detected.</p><p><b>'+overwriteCount+'</b> existing room'+(overwriteCount===1?' will':'s will')+' be overwritten, and <b>'+newCount+'</b> new room'+(newCount===1?'':'s')+' will be added.</p><p class="muted">Room Number is used to identify an existing room. Imported rooms will use Available status.</p>'}else if(type==='subjects'){details='<p><b>'+rows.length+'</b> subject records were detected.</p><p><b>'+overwriteCount+'</b> existing subject'+(overwriteCount===1?' will':'s will')+' be overwritten, and <b>'+newCount+'</b> new subject'+(newCount===1?'':'s')+' will be added.</p><p class="muted">Existing subjects are matched by Class and Subject name.</p>'}else{details='<p><b>'+rows.length+'</b> section records were detected for '+label+'.</p><p class="muted">Each row should contain Class, Section and Student Count. Existing matching classes/sections will be updated.</p>'}openModal('<div class="modalhead"><h2>Confirm Import</h2><button class="x" onclick="closeModal()">×</button></div><p>You selected <b>'+file.name+'</b>.</p>'+details+'<div style="text-align:right"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="confirmImportDb()">CONFIRM IMPORT</button></div>')}catch(err){toast(err.message||'Could not read Excel file')}input.value=''};reader.readAsArrayBuffer(file)}

function validateClassImportRows(rows){const seen=new Set();for(let i=0;i<rows.length;i++){const r=rows[i],cls=Number(r.Class??r.class??r['Class Number']),section=String(r.Section??r.section??'').trim().toUpperCase(),count=Number(r['Student Count']??r.student_count??r.Students??'');if(!Number.isInteger(cls)||cls<1||cls>12)throw new Error('Row '+(i+2)+': Class must be a whole number from 1 to 12.');if(!/^[A-J]$/.test(section))throw new Error('Row '+(i+2)+': Section must be a single letter from A to J.');if(!Number.isInteger(count)||count<1||count>99)throw new Error('Row '+(i+2)+': Student Count must be a whole number from 1 to 99.');const key=cls+'-'+section;if(seen.has(key))throw new Error('Duplicate Class '+cls+' / Section '+section+' found in the file.');seen.add(key)}}
async function confirmImportDb(){const imp=window.pendingImport;if(!imp)return;try{if(imp.type==='classes'){await importClasses(imp.rows);go('classes')}else if(imp.type==='rooms'){await importRooms(imp.rows);go('rooms')}else{await importSubjects(imp.rows);go('subjects')}window.pendingImport=null;closeModal();toast('Import completed successfully')}catch(e){toast(e.message||'Import failed')}}
async function importClasses(rows){const grouped={};for(const r of rows){const cls=Number(r.Class??r.class??r['Class Number']),section=String(r.Section??r.section??'').trim().toUpperCase(),count=Number(r['Student Count']??r.student_count??r.Students);if(!grouped[cls])grouped[cls]=[];grouped[cls].push({section,count})}for(const cls of Object.keys(grouped)){let {data:c,error}=await db.from('sc_classes').select('id').eq('school_id',APP.schoolId).eq('session_id',APP.sessionId).eq('class_number',Number(cls)).maybeSingle();if(error)throw error;if(!c){({data:c,error}=await db.from('sc_classes').insert({school_id:APP.schoolId,session_id:APP.sessionId,class_number:Number(cls)}).select('id').single());if(error)throw error}for(const item of grouped[cls]){const {error:e2}=await db.from('sc_sections').upsert({school_id:APP.schoolId,class_id:c.id,section_name:item.section,student_count:item.count},{onConflict:'class_id,section_name'});if(e2)throw e2}}await logHistory('Imported','Classes',null,'Excel class and section import')}
function validateSubjectImportRows(rows){const seen=new Set();for(let i=0;i<rows.length;i++){const r=rows[i],cls=Number(r.Class??r.class??r['Class Number']),name=String(r.Subject??r.subject??r['Subject Name']??'').trim(),status=String(r.Status??r.status??'Active').trim()||'Active';if(!Number.isInteger(cls)||cls<1||cls>12)throw new Error('Row '+(i+2)+': Class must be a whole number from 1 to 12.');if(!name)throw new Error('Row '+(i+2)+': Subject is required.');if(!['Active','Inactive'].includes(status))throw new Error('Row '+(i+2)+': Status must be Active or Inactive.');const key=cls+'|'+name.toLowerCase();if(seen.has(key))throw new Error('Duplicate Class '+cls+' / Subject '+name+' found in the file.');seen.add(key)}}
function validateRoomImportRows(rows){const seenNumbers=new Set();for(let i=0;i<rows.length;i++){const r=rows[i],number=String(r['Room Number']??r.room_number??r.Room??'').trim(),capacityValue=r.Capacity??r.capacity??'',capacity=capacityValue===''?null:Number(capacityValue);if(!number)throw new Error('Row '+(i+2)+': Room Number is required.');if(capacity!==null&&(!Number.isInteger(capacity)||capacity<1||capacity>99))throw new Error('Row '+(i+2)+': Capacity must be a whole number from 1 to 99.');const rk=number.toLowerCase();if(seenNumbers.has(rk))throw new Error('Duplicate room number found in row '+(i+2)+'.');seenNumbers.add(rk)}}
async function importSubjects(rows){validateSubjectImportRows(rows);const classes=await db.from('sc_classes').select('id,class_number').eq('school_id',APP.schoolId).eq('session_id',APP.sessionId);if(classes.error)throw classes.error;const classMap=new Map((classes.data||[]).map(x=>[Number(x.class_number),x.id]));const existing=await db.from('sc_subjects').select('id,class_id,subject_name').eq('school_id',APP.schoolId).eq('session_id',APP.sessionId);if(existing.error)throw existing.error;const existingMap=new Map((existing.data||[]).map(x=>[x.class_id+'|'+String(x.subject_name||'').trim().toLowerCase(),x.id]));for(const r of rows){const cls=Number(r.Class??r.class??r['Class Number']),name=String(r.Subject??r.subject??r['Subject Name']??'').trim(),status=String(r.Status??r.status??'Active').trim()||'Active',classId=classMap.get(cls);if(!classId)throw new Error('Class '+cls+' does not exist in the current session.');const key=classId+'|'+name.toLowerCase(),payload={school_id:APP.schoolId,session_id:APP.sessionId,class_id:classId,subject_name:name,status},existingId=existingMap.get(key);if(existingId){const result=await db.from('sc_subjects').update(payload).eq('id',existingId);if(result.error)throw result.error}else{const result=await db.from('sc_subjects').insert(payload).select('id').single();if(result.error)throw result.error;await initializeSubjectRollsDb(result.data.id,classId)}}await logHistory('Imported','Subjects',null,'Excel subject import with existing subject overwrite')}
async function importRooms(rows){validateRoomImportRows(rows);const existing=await db.from('sc_rooms').select('id,room_number').eq('school_id',APP.schoolId).eq('session_id',APP.sessionId);if(existing.error)throw existing.error;const existingMap=new Map((existing.data||[]).filter(x=>x.room_number).map(x=>[x.room_number.trim().toLowerCase(),x.id]));for(const r of rows){const roomNumber=String(r['Room Number']??r.room_number??r.Room??'').trim(),capacityValue=r.Capacity??r.capacity??'',capacity=capacityValue===''?null:Number(capacityValue),roomName=String(r['Room Name']??r.room_name??'').trim(),floor=String(r.Floor??r.floor??'').trim(),existingId=existingMap.get(roomNumber.toLowerCase()),payload={school_id:APP.schoolId,session_id:APP.sessionId,room_name:roomName,room_number:roomNumber,capacity,floor,status:'Available'};const result=existingId?await db.from('sc_rooms').update(payload).eq('id',existingId):await db.from('sc_rooms').insert(payload);if(result.error)throw result.error}await logHistory('Imported','Rooms',null,'Excel room import with existing room overwrite')}

async function logHistory(action,type,id,description){try{await db.from('sc_history').insert({school_id:APP.schoolId,user_id:APP.user.id,action,entity_type:type,entity_id:id||null,description})}catch(e){}}
document.getElementById('modalbg').onclick=e=>{if(e.target.id==='modalbg')closeModal()};
window.addEventListener('load',async()=>{const {data:{user}}=await db.auth.getUser();if(user){await bootstrap()}else{showAuth('login')}});
