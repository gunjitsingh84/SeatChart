const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const APP={user:null,schoolId:null,sessionId:null,profile:null,currentPage:null};const AUTO_REFRESH_MS=60000;const AUTO_LOGOUT_MS=30*60*1000;let __scLogoutTimer=null,__scRefreshTimer=null;

function initCtaLoading(){document.addEventListener('click',event=>{const btn=event.target.closest('button.btn.primary');if(!btn||btn.disabled||btn.dataset.noLoading==='true'||btn.dataset.busy==='true')return;const html=btn.innerHTML.trim();if(!html)return;btn.dataset.busy='true';btn.dataset.originalHtml=html;btn.disabled=true;btn.innerHTML='<span class="cta-spinner" aria-hidden="true"></span> PROCESSING…';const timeout=Number(btn.dataset.ctaTimeout||15000);clearTimeout(btn.__ctaTimer);btn.__ctaTimer=setTimeout(()=>releaseCtaLoading(btn),timeout)},true)}

function releaseCtaLoading(btn){if(!btn||!btn.isConnected)return;clearTimeout(btn.__ctaTimer);btn.disabled=false;btn.dataset.busy='';if(btn.dataset.originalHtml)btn.innerHTML=btn.dataset.originalHtml;delete btn.dataset.originalHtml}function authError(msg){document.getElementById('authError').innerHTML=`<div class="error-note">${msg}</div>`}

function accountEmail(phone){return phone.replace(/\D/g,'')+'@login.seatchart.app'}

async function signupReal(){const name=document.getElementById('suName').value.trim(),phone=normalizePhone(document.getElementById('suPhone').value),school=document.getElementById('suSchool').value.trim(),address=document.getElementById('suAddress').value.trim(),pin=document.getElementById('suPin').value,pin2=document.getElementById('suPin2').value;if(!name||!school||!/^[0-9]{6}$/.test(pin)||pin!==pin2||!/^\+91\d{10}$/.test(phone))return authError('Please complete all required fields and use a matching 6-digit PIN.');const {data,error}=await db.auth.signUp({email:accountEmail(phone),password:pin});if(error)return authError(error.message);if(!data.session)return authError('Account created, but Supabase email confirmation is enabled. Disable email confirmation for the no-email workflow.');const uid=data.user.id;const schoolId=crypto.randomUUID();let r=await db.from('sc_schools').insert({id:schoolId,name:school,address:address||null,phone,created_by:uid});if(r.error){await db.auth.signOut();showAuth('signup');return authError(r.error.message)}r=await db.from('sc_user_profiles').insert({id:uid,school_id:schoolId,full_name:name,phone,role:'Administrator'});if(r.error){await db.auth.signOut();showAuth('signup');return authError(r.error.message)}const session=await ensureCurrentSession(schoolId);if(!session){await db.auth.signOut();showAuth('signup');return authError('Unable to create the academic session. Please try again.')}await bootstrap()}
async function ensureCurrentSession(schoolId){const now=new Date(),startYear=now.getMonth()>=3?now.getFullYear():now.getFullYear()-1,endYear=startYear+1,name=`${startYear}–${String(endYear).slice(-2)}`;let {data}=await db.from('sc_academic_sessions').select('*').eq('school_id',schoolId).eq('session_name',name).maybeSingle();if(!data){let r=await db.from('sc_academic_sessions').insert({school_id:schoolId,session_name:name,start_date:`${startYear}-04-01`,end_date:`${endYear}-03-31`,is_current:true}).select('*').single();data=r.data}return data}

async function deleteAllClassesDb(){
  if(!APP.schoolId||!APP.sessionId)return toast('School or academic session is not available.');
  if(!confirm('Delete ALL classes and sections for the current academic session? This cannot be undone.'))return;
  try{
    const classRes=await db.from('sc_classes').select('id,class_number').eq('school_id',APP.schoolId).eq('session_id',APP.sessionId);
    if(classRes.error)throw classRes.error;
    const classIds=(classRes.data||[]).map(x=>x.id);
    if(!classIds.length)return toast('No classes found for the current academic session.');
    const subjectRes=await db.from('sc_subjects').select('id').eq('school_id',APP.schoolId).in('class_id',classIds).limit(1);
    if(subjectRes.error)throw subjectRes.error;
    if(subjectRes.data?.length)return toast('Classes cannot be deleted because subjects are mapped to them. Remove the subjects first.');
    const sectionRes=await db.from('sc_sections').select('id').eq('school_id',APP.schoolId).in('class_id',classIds);
    if(sectionRes.error)throw sectionRes.error;
    const sectionIds=(sectionRes.data||[]).map(x=>x.id);
    if(sectionIds.length){
      const rollRes=await db.from('sc_subject_rolls').select('id').eq('school_id',APP.schoolId).in('section_id',sectionIds).limit(1);
      if(rollRes.error)throw rollRes.error;
      if(rollRes.data?.length)return toast('Classes cannot be deleted because roll-number assignments exist. Remove the roll assignments first.');
      const seatRes=await db.from('sc_seating_assignments').select('id').eq('school_id',APP.schoolId).in('section_id',sectionIds).limit(1);
      if(seatRes.error)throw seatRes.error;
      if(seatRes.data?.length)return toast('Classes cannot be deleted because seating assignments exist. Remove the seating plans first.');
      const sectionDelete=await db.from('sc_sections').delete().eq('school_id',APP.schoolId).in('id',sectionIds);
      if(sectionDelete.error)throw sectionDelete.error;
    }
    const classDelete=await db.from('sc_classes').delete().eq('school_id',APP.schoolId).eq('session_id',APP.sessionId).in('id',classIds);
    if(classDelete.error)throw classDelete.error;
    await logHistory('Deleted','Classes',APP.sessionId,'All classes and sections deleted for the current academic session');
    toast('All classes and sections deleted.');
    await loadClasses();
  }catch(e){
    console.error('deleteAllClassesDb failed',e);
    toast(e.message||'Unable to delete all classes and sections.');
  }
}

async function saveEditedClass(id){
const {data,error}=await db.from('sc_classes').select('*,sc_sections(*)').eq('id',id).single();
if(error)return toast(error.message);
const cls=Number(document.getElementById('editClassNo').value),n=Number(document.getElementById('editSecCount').value),existing=data.sc_sections||[];for(let i=0;i<n;i++){const count=Number(document.getElementById('editStudent_'+i).value);if(!Number.isInteger(count)||count<1||count>99)return toast('Student count must be between 1 and 99.');}
const removed=existing.filter(x=>x.section_name>String.fromCharCode(64+n));
if(removed.length){const rr=await db.from('sc_subject_rolls').select('id').in('section_id',removed.map(x=>x.id)).limit(1);if(rr.data?.length)return toast('A section being removed has roll-number assignments. Remove those assignments first.');}
const u=await db.from('sc_classes').update({class_number:cls}).eq('id',id);if(u.error)return toast(u.error.message);
for(let i=0;i<n;i++){const name=String.fromCharCode(65+i),old=existing.find(x=>x.section_name===name),count=Number(document.getElementById('editStudent_'+i).value||0);const e=old?await db.from('sc_sections').update({student_count:count}).eq('id',old.id):await db.from('sc_sections').insert({school_id:APP.schoolId,class_id:id,section_name:name,student_count:count});if(e.error)return toast(e.error.message)}
if(removed.length){const e=await db.from('sc_sections').delete().in('id',removed.map(x=>x.id));if(e.error)return toast(e.error.message)}
await logHistory('Updated','Class',id,'Class '+cls+' and sections updated');closeModal();toast('Class updated');loadClasses()
}

async function loadSubjectRollCountsDb(){
  const assignedBySubject=new Map();
  const pageSize=1000;
  let from=0;
  while(true){
    const result=await db.from('sc_subject_rolls')
      .select('subject_id')
      .eq('school_id',APP.schoolId)
      .range(from,from+pageSize-1);
    if(result.error)throw result.error;
    const rows=result.data||[];
    rows.forEach(x=>assignedBySubject.set(x.subject_id,(assignedBySubject.get(x.subject_id)||0)+1));
    if(rows.length<pageSize)break;
    from+=pageSize;
  }
  return assignedBySubject;
}

async function loadSubjects(){

      const sections=(sectionsRes.data||[]).filter(x=>x.class_id===r.class_id);
      return {
        ...r,
        roll_assigned:assignedBySubject.get(r.id)||0,
        roll_total:sections.reduce((sum,x)=>sum+Number(x.student_count||0),0)
      };
    }).sort((a,b)=>

async function initializeSubjectRollsDb(subjectId,classId){
  const sections=await db.from('sc_sections').select('id,student_count').eq('school_id',APP.schoolId).eq('class_id',classId);
  if(sections.error)throw sections.error;
  const existing=await db.from('sc_subject_rolls').select('section_id,roll_number').eq('school_id',APP.schoolId).eq('subject_id',subjectId);
  if(existing.error)throw existing.error;
  const existingKeys=new Set((existing.data||[]).map(x=>x.section_id+'|'+x.roll_number));
  const additions=[];
  (sections.data||[]).forEach(section=>{
    for(let roll=1;roll<=Number(section.student_count||0);roll++){
      const key=section.id+'|'+roll;
      if(!existingKeys.has(key))additions.push({school_id:APP.schoolId,subject_id:subjectId,section_id:section.id,roll_number:roll});
    }
  });
  if(additions.length){
    const result=await db.from('sc_subject_rolls').insert(additions);
    if(result.error)throw result.error;
  }
  return additions.length;
}

async function saveSubjectDb(mode){const classId=document.getElementById('subjectBulkClass')?.value||'',nameEls=[...document.querySelectorAll('.subjectBulkName')],rows=[];if(!classId)return toast('Select a class.');for(let i=0;i<nameEls.length;i++){const name=nameEls[i].value.trim(),status=nameEls[i].dataset.status||'Active',id=nameEls[i].dataset.id||'';if(!name)continue;rows.push({id,name,status})}if(!rows.length)return toast('Add at least one subject.');const seen=new Set();for(const row of rows){const key=row.name.toLowerCase();if(seen.has(key))return toast('Duplicate subject found: '+row.name);seen.add(key)}const existing=await db.from('sc_subjects').select('id,subject_name').eq('school_id',APP.schoolId).eq('session_id',APP.sessionId).eq('class_id',classId);if(existing.error)return toast(existing.error.message);const editingIds=new Set(rows.filter(x=>x.id).map(x=>x.id));for(const row of rows){const conflict=(existing.data||[]).find(x=>String(x.subject_name||'').trim().toLowerCase()===row.name.toLowerCase()&&!editingIds.has(x.id));if(conflict)return toast('Subject already exists for this class: '+row.name)}for(const row of rows){const payload={school_id:APP.schoolId,session_id:APP.sessionId,class_id:classId,subject_name:row.name,status:row.status||'Active'};if(row.id){const result=await db.from('sc_subjects').update(payload).eq('id',row.id);if(result.error)return toast(result.error.message)}else{const result=await db.from('sc_subjects').insert(payload).select('id').single();if(result.error)return toast(result.error.message);try{await initializeSubjectRollsDb(result.data.id,classId)}catch(e){await db.from('sc_subjects').delete().eq('id',result.data.id).eq('school_id',APP.schoolId);return toast(e.message||'Unable to initialize subject roll assignments')}}}await logHistory(mode==='edit'?'Updated':'Created','Subjects',null,rows.length+' subject'+(rows.length===1?'':'s')+' saved for class');closeModal();toast(rows.length+' subject'+(rows.length===1?'':'s')+' saved');loadSubjects()}


async function assignRollsDb(subjectId,classNo,subjectName){
  try{
    const subjectRes=await db.from('sc_subjects').select('id,class_id,subject_name').eq('id',subjectId).eq('school_id',APP.schoolId).eq('session_id',APP.sessionId).single();
    if(subjectRes.error)return toast(subjectRes.error.message);
    const [sectionsRes,rollsRes]=await Promise.all([
      db.from('sc_sections').select('id,section_name,student_count').eq('school_id',APP.schoolId).eq('class_id',subjectRes.data.class_id).order('section_name'),
      db.from('sc_subject_rolls').select('id,section_id,roll_number').eq('school_id',APP.schoolId).eq('subject_id',subjectId)
    ]);
    if(sectionsRes.error)return toast(sectionsRes.error.message);
    if(rollsRes.error)return toast(rollsRes.error.message);
    const sections=sectionsRes.data||[];
    if(!sections.length)return toast('No sections are configured for Class '+classNo+'.');
    const existing=rollsRes.data||[];
    const hasAnySavedRolls=existing.length>0;
    const savedBySection=new Map();
    existing.forEach(x=>{
      if(!savedBySection.has(x.section_id))savedBySection.set(x.section_id,new Set());
      savedBySection.get(x.section_id).add(Number(x.roll_number));
    });
    window.rollAssignmentState={subjectId,classNo,subjectName,sections,selected:new Map()};
    sections.forEach(section=>{
      const count=Number(section.student_count||0);
      const saved=savedBySection.get(section.id);
      const selected=new Set();
      if(!hasAnySavedRolls){
        for(let roll=1;roll<=count;roll++)selected.add(roll);
      }else if(saved){
        saved.forEach(roll=>{
          if(roll>=1&&roll<=count)selected.add(roll);
        });
      }
      window.rollAssignmentState.selected.set(section.id,selected);
    });
    renderAssignRollsModal();
  }catch(e){console.error('assignRollsDb failed',e);toast(e.message||'Unable to load roll assignments')}
}
function renderAssignRollsModal(){
  const s=window.rollAssignmentState;if(!s)return;

  ${s.sections.map(section=>{
    const count=Number(section.student_count||0),selected=s.selected.get(section.id)||new Set();
    return `<div class="section" style="padding-top:14px;margin-top:14px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px">
        <div><div style="font-weight:800;font-size:12px">Section ${section.section_name}</div><div style="font-size:9px;color:#6d778b">${count} students · ${selected.size} rolls selected</div></div>
        <div class="roll-tools" style="margin:0"><button class="btn" type="button" onclick="assignAllSectionRolls('${section.id}')">ASSIGN ALL</button><button class="btn" type="button" onclick="deselectAllSectionRolls('${section.id}')">DESELECT ALL</button></div>
      </div>

function plannerEscape(v){
  return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function plannerDateKey(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function plannerLocalDate(value){const p=String(value).split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function plannerDateLabel(value){return plannerLocalDate(value).toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'})}
function plannerDayName(value){return plannerLocalDate(value).toLocaleDateString(undefined,{weekday:'short'})}
function plannerIsSecondSaturday(value){
  const d=plannerLocalDate(value);
  return d.getDay()===6 && d.getDate()>=8 && d.getDate()<=14;
}
function plannerAvailableDates(startDate,endDate,includeSaturdays,breakSet){
  const dates=[],d=plannerLocalDate(startDate),end=plannerLocalDate(endDate);
  while(d<=end){
    const key=plannerDateKey(d),day=d.getDay();
    const excludedSunday=day===0;
    const excludedSaturday=day===6 && (!includeSaturdays||plannerIsSecondSaturday(key));
    if(!excludedSunday&&!excludedSaturday&&!breakSet.has(key))dates.push(key);
    d.setDate(d.getDate()+1);
  }
  return dates;
}
function plannerSpacedDates(available,count,gap){
  if(count<=0)return[];
  const dates=[];
  let cursor=0;
  for(let i=0;i<count;i++){
    if(cursor>=available.length)return null;
    const examDate=available[cursor];
    const examDay=plannerLocalDate(examDate).getDay();
    if(examDay===0)return null;
    dates.push(examDate);
    cursor+=gap+1;
  }
  return dates;
}
function plannerShuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}

async function generateExamPlannerDb(){

function examCalendarValidation(){
  const p=window.activeExamPlanner;if(!p)return{conflicts:new Set(),messages:[]};
  const byClassDate=new Map(),conflicts=new Set(),messages=[],validDatesArray=plannerAvailableDates(p.exam.start_date,p.exam.end_date,p.exam.include_saturdays,new Set(p.breaks.map(x=>x.break_date))),validDates=new Set(validDatesArray);
  p.schedules.forEach(x=>{
    const key=x.class_id+'|'+x.exam_date;
    if(!byClassDate.has(key))byClassDate.set(key,[]);
    byClassDate.get(key).push(x);
    if(x.exam_date<p.exam.start_date||x.exam_date>p.exam.end_date){conflicts.add(x.id);messages.push('An exam is outside the examination period.')}
    else if(!validDates.has(x.exam_date)){conflicts.add(x.id);messages.push('An exam is scheduled on an excluded date: '+plannerDateLabel(x.exam_date)+'.')}
  });
  byClassDate.forEach((items,key)=>{if(items.length>1){items.forEach(x=>conflicts.add(x.id));const [classId,date]=key.split('|');const cls=p.classes.find(c=>c.id===classId);messages.push(`Class ${cls?.class_number||''} has ${items.length} exams on ${plannerDateLabel(date)}.`)}});
  const studyLeaveDays=Math.max(0,Number(p.exam.study_leave_days||0)),dateIndex=new Map(validDatesArray.map((date,index)=>[date,index]));
  const schedulesByClass=new Map();p.schedules.forEach(x=>{if(!schedulesByClass.has(x.class_id))schedulesByClass.set(x.class_id,[]);schedulesByClass.get(x.class_id).push(x)});
  schedulesByClass.forEach((items,classId)=>{const ordered=[...items].filter(x=>dateIndex.has(x.exam_date)).sort((a,b)=>dateIndex.get(a.exam_date)-dateIndex.get(b.exam_date));for(let i=1;i<ordered.length;i++){const gap=dateIndex.get(ordered[i].exam_date)-dateIndex.get(ordered[i-1].exam_date)-1;if(gap!==studyLeaveDays){conflicts.add(ordered[i-1].id);conflicts.add(ordered[i].id);const cls=p.classes.find(c=>c.id===classId);messages.push(`Class ${cls?.class_number||''} must have exactly ${studyLeaveDays} study-leave day${studyLeaveDays===1?'':'s'} between exams.`)}}});
  return{conflicts,messages:[...new Set(messages)]};
}

async function dropPlannerExam(e,date){

  row.exam_date=date;await logHistory('Updated','Exam Schedule',id,'Exam moved to '+plannerDateLabel(date));renderExamCalendar();
}

font-weight:800;color:#53627a;margin-bottom:4px}.student{font-size:9px;line-height:1.3}.footer{display:flex;justify-content:space-between;margin-top:7px;font-size:8px;color:#68748a}@media print{.room-page{break-after:page}.room-page:last-child{break-after:auto}.summary-page{break-after:page}}</style></head><body><section class="summary-page"><div class="summary-title"><div class="summary-brand">'+logo+'<div class="school-name">'+esc(school.name||'School')+'</div><div class="document-title">CONSOLIDATED SEATING CANDIDATE LIST</div><div>'+esc(examRes.data.exam_name)+' · '+esc(plannerDateLabel(examDate))+'</div></div></div><table class="summary-table"><thead><tr><th>Class</th><th>Subject</th><th>Roll Numbers</th></tr></thead><tbody>'+consolidated+'</tbody></table></section>'+roomPages+'</body></html>';

async function openSeatingForExamDate(examId,examDate){
  try{
    const [scheduleRes,subjectRes,classRes,sectionRes,examRes]=await Promise.all([
      db.from('sc_exam_schedules').select('id,class_id,subject_id,exam_date').eq('exam_id',examId).eq('school_id',APP.schoolId).eq('exam_date',examDate),
      db.from('sc_subjects').select('id,class_id,subject_name').eq('school_id',APP.schoolId).eq('session_id',APP.sessionId),
      db.from('sc_classes').select('id,class_number').eq('school_id',APP.schoolId).eq('session_id',APP.sessionId),
      db.from('sc_sections').select('id,class_id,section_name,student_count').eq('school_id',APP.schoolId),
      db.from('sc_exams').select('id,exam_name,paper_start_time,paper_end_time').eq('id',examId).eq('school_id',APP.schoolId).single()
    ]);
    if(scheduleRes.error)throw scheduleRes.error;
    if(subjectRes.error)throw subjectRes.error;
    if(classRes.error)throw classRes.error;
    if(sectionRes.error)throw sectionRes.error;
    if(examRes.error)throw examRes.error;

    const schedules=scheduleRes.data||[],subjects=subjectRes.data||[],classes=classRes.data||[],sections=sectionRes.data||[],exam=examRes.data;
    if(!schedules.length){toast('No scheduled papers were found for this date.');return}
    const classMap=new Map(classes.map(x=>[x.id,x]));
    const subjectMap=new Map(subjects.map(x=>[x.id,x]));
    const sectionsByClass=new Map();
    sections.forEach(x=>{if(!sectionsByClass.has(x.class_id))sectionsByClass.set(x.class_id,[]);sectionsByClass.get(x.class_id).push(x)});

    const subjectIds=[...new Set(schedules.map(x=>x.subject_id))];
    const rolls=[];
    for(let from=0;from<subjectIds.length;from+=8){
      const batch=subjectIds.slice(from,from+8);
      let start=0;
      while(true){
        const rr=await db.from('sc_subject_rolls').select('subject_id,section_id,roll_number').eq('school_id',APP.schoolId).in('subject_id',batch).range(start,start+999);
        if(rr.error)throw rr.error;
        rolls.push(...(rr.data||[]));
        if(!rr.data||rr.data.length<1000)break;
        start+=1000;
      }
    }

    const rollSetBySubjectSection=new Map();
    rolls.forEach(x=>{
      const key=x.subject_id+'|'+x.section_id;
      if(!rollSetBySubjectSection.has(key))rollSetBySubjectSection.set(key,new Set());
      rollSetBySubjectSection.get(key).add(Number(x.roll_number));
    });

    const rows=schedules.map(s=>{
      const cls=classMap.get(s.class_id),subject=subjectMap.get(s.subject_id);
      const candidateKeys=new Set();
      (sectionsByClass.get(s.class_id)||[]).forEach(sec=>{
        const set=rollSetBySubjectSection.get(s.subject_id+'|'+sec.id)||new Set();
        set.forEach(roll=>candidateKeys.add(sec.id+'|'+roll));
      });
      return {classId:s.class_id,classNumber:Number(cls?.class_number||0),subjectId:s.subject_id,subjectName:subject?.subject_name||'—',candidates:candidateKeys.size};
    }).sort((a,b)=>a.classNumber-b.classNumber||a.subjectName.localeCompare(b.subjectName));

    const classIds=[...new Set(rows.map(r=>r.classId))].sort((a,b)=>Number(classMap.get(a)?.class_number||0)-Number(classMap.get(b)?.class_number||0));
    const totalCandidatesByClass=new Map();
    classIds.forEach(classId=>{
      const keys=new Set();
      rows.filter(r=>r.classId===classId).forEach(r=>{
        (sectionsByClass.get(classId)||[]).forEach(sec=>{
          const set=rollSetBySubjectSection.get(r.subjectId+'|'+sec.id)||new Set();
          set.forEach(roll=>keys.add(sec.id+'|'+roll));
        });
      });
      totalCandidatesByClass.set(classId,keys.size);
    });
    const totalCandidates=[...totalCandidatesByClass.values()].reduce((a,b)=>a+b,0);

    const pairingRows=[];
    for(let i=0;i<classIds.length;i++){
      for(let j=i+1;j<classIds.length;j++){
        const a=classIds[i],b=classIds[j];
        const an=Number(classMap.get(a)?.class_number||0),bn=Number(classMap.get(b)?.class_number||0);
        const subjectsA=new Set(rows.filter(r=>r.classId===a).map(r=>String(r.subjectName).trim().toLowerCase()));
        const subjectsB=new Set(rows.filter(r=>r.classId===b).map(r=>String(r.subjectName).trim().toLowerCase()));
        const sameSubject=[...subjectsA].some(x=>subjectsB.has(x));
        const consecutive=Math.abs(an-bn)===1;
        const allowed=!sameSubject&&!consecutive;
        pairingRows.push({a,b,an,bn,sameSubject,consecutive,allowed});
      }
    }

    const seatingCandidates=[];
    const candidateSeen=new Map();
    schedules.forEach(sch=>{
      const cls=classMap.get(sch.class_id);
      const subject=subjectMap.get(sch.subject_id);
      (sectionsByClass.get(sch.class_id)||[]).forEach(sec=>{
        const set=rollSetBySubjectSection.get(sch.subject_id+'|'+sec.id)||new Set();
        set.forEach(roll=>{
          const key=sec.id+'|'+Number(roll);
          let candidate=candidateSeen.get(key);
          if(!candidate){
            candidate={key,sectionId:sec.id,sectionName:sec.section_name,classId:sch.class_id,classNumber:Number(cls?.class_number||0),rollNumber:Number(roll),subjectNames:[]};
            candidateSeen.set(key,candidate);
            seatingCandidates.push(candidate);
          }
          const subjectName=String(subject?.subject_name||'—').trim();
          if(subjectName&&!candidate.subjectNames.includes(subjectName))candidate.subjectNames.push(subjectName);
        });
      });
    });
    seatingCandidates.forEach(x=>{x.subjectName=x.subjectNames.join(', ');});
    window.seatingRuleState={examId,examDate,studentsPerBench:1,totalCandidates,candidates:seatingCandidates,allowedPairs:new Set(pairingRows.filter(x=>x.allowed).map(x=>x.a+'|'+x.b))};

    const ruleBadge=(type,label)=>{
      const warning=type==='warning';
      return '<span class="badge" style="'+(warning?'background:#fff1f0;color:#b53a32':'background:#eef8f2;color:#218653')+'">'+label+'</span>';
    };
    const pairingHtml=pairingRows.length?pairingRows.map(p=>{
      const key=p.a+'|'+p.b;
      const warning=p.sameSubject||p.consecutive;
      const ruleLabel=p.sameSubject?'Warning: Same subject':p.consecutive?'Warning: Consecutive classes':'Allowed';
      return '<tr><td>Class '+p.an+'</td><td>Class '+p.bn+'</td><td>'+ruleBadge(warning?'warning':'allowed',ruleLabel)+'</td><td><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" '+(p.allowed?'checked':'')+' onchange="toggleSeatingPair(\''+key+'\')"> Allow pairing</label></td></tr>';
    }).join(''):'<tr><td colspan="4" class="note">Only one exam class is scheduled for this date, so no class pairing is available.</td></tr>';

    openModal('<div class="modalhead"><h2>Generate Seating Plan</h2><button class="x" onclick="closeModal()">×</button></div>'+
      '<div class="note" style="margin-bottom:16px"><b>'+plannerEscape(exam.exam_name)+'</b> · '+plannerDateLabel(examDate)+' · '+String(exam.paper_start_time).slice(0,5)+' – '+String(exam.paper_end_time).slice(0,5)+'</div>'+
      '<div class="cards" style="margin-bottom:16px"><div class="card"><div class="label">Exam Classes</div><div class="metric">'+classIds.length+'</div></div><div class="card"><div class="label">Exam Papers</div><div class="metric">'+rows.length+'</div></div><div class="card"><div class="label">Candidate Seats</div><div class="metric">'+totalCandidates+'</div><div class="note">Unique candidates across scheduled papers</div></div></div>'+
      '<div class="card" style="margin-bottom:16px"><div class="cardhead"><h3 style="margin:0">Candidates for this date</h3><span class="note">Pulled directly from scheduled subjects and subject roll assignments</span></div><div class="tablewrap"><table class="table"><thead><tr><th>Class</th><th>Subject</th><th>Candidates</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>Class '+r.classNumber+'</td><td><b>'+plannerEscape(r.subjectName)+'</b></td><td>'+r.candidates+'</td></tr>').join('')+'</tbody></table></div></div>'+
      '<div class="card" style="margin-bottom:16px"><div class="cardhead"><h3 style="margin:0">Seating Rules</h3><span class="note">Rules are calculated from this exam date</span></div>'+
      '<div class="split"><label class="field"><span>Students per bench</span><select id="seatingStudentsPerBench" onchange="window.seatingRuleState.studentsPerBench=Number(this.value)"><option value="1">1 student per bench</option><option value="2">2 students per bench</option></select></label><div><div class="label">2-student bench rules</div><div class="note" style="margin-top:8px">Same-class pairing is never allowed. Same-subject and consecutive-class pairings are recommended to avoid, but can be overridden by selecting Allow pairing.</div></div></div>'+
      '<div style="margin-top:16px"><div class="label" style="margin-bottom:8px">Class pairing options</div><div class="setup-note" style="margin:0 0 10px">Green means the pairing follows the thumb rules. Red means there is a warning, but you can still select the pairing and continue to room selection.</div><div class="tablewrap"><table class="table"><thead><tr><th>Class A</th><th>Class B</th><th>Rule Check</th><th>Use Pairing</th></tr></thead><tbody>'+pairingHtml+'</tbody></table></div></div></div>'+
      '<div style="text-align:right;margin-top:16px"><button class="btn" onclick="closeModal()">CANCEL</button><button class="btn primary" onclick="continueSeatingToRoomSelection()">CONTINUE TO ROOM SELECTION</button></div>');
  }catch(e){
    console.error('openSeatingForExamDate failed',e);
    toast(e.message||'Unable to load seating candidates');
  }
}
function toggleSeatingPair(key){
  if(!window.seatingRuleState)return;
  if(window.seatingRuleState.allowedPairs.has(key))window.seatingRuleState.allowedPairs.delete(key);
  else window.seatingRuleState.allowedPairs.add(key);
}
async function continueSeatingToRoomSelection(){
  if(!window.seatingRuleState)return toast('Seating configuration is not available.');
  try{
    const roomRes=await db.from('sc_rooms').select('id,room_number,room_name,capacity,layout_rows,layout_columns,floor,status').eq('school_id',APP.schoolId).eq('session_id',APP.sessionId).order('room_number');
    if(roomRes.error)throw roomRes.error;
    const rooms=roomRes.data||[];
    window.seatingRuleState.rooms=rooms;
    window.seatingRuleState.selectedRoomIds=new Set();
    renderSeatingRoomSelection();
  }catch(e){
    console.error('continueSeatingToRoomSelection failed',e);
    toast(e.message||'Unable to load rooms');
  }
}
function seatingRoomCapacitySummary(){
  const s=window.seatingRuleState;
  if(!s)return{selectedRooms:[],benchCapacity:0,studentCapacity:0,requiredBenches:0,theoreticalRequiredBenches:0,requiredStudents:0,pairedCount:0,singleCount:0};
  const selectedRooms=(s.rooms||[]).filter(r=>s.selectedRoomIds?.has(r.id));
  const benchCapacity=selectedRooms.reduce((sum,r)=>sum+Number(r.capacity||0),0);
  const requiredStudents=Number(s.totalCandidates||0);
  const theoreticalRequiredBenches=s.studentsPerBench===2?Math.ceil(requiredStudents/2):requiredStudents;
  let requiredBenches=theoreticalRequiredBenches,pairedCount=0,singleCount=requiredStudents;
  if(s.studentsPerBench===2&&Array.isArray(s.candidates)){
    const generated=buildSeatingBenches();
    requiredBenches=generated.benches.length;
    pairedCount=generated.pairedCount;
    singleCount=generated.singleCount;
  }
  return{selectedRooms,benchCapacity,studentCapacity:benchCapacity*Number(s.studentsPerBench||1),requiredBenches,theoreticalRequiredBenches,requiredStudents,pairedCount,singleCount};
}
function renderSeatingRoomSelection(){
  const s=window.seatingRuleState;
  if(!s)return;
  const rooms=(s.rooms||[]);
  const available=rooms.filter(r=>r.status==='Available'&&Number(r.capacity)>0&&Number(r.layout_rows)>0&&Number(r.layout_columns)>0);
  const unavailable=rooms.filter(r=>!(r.status==='Available'&&Number(r.capacity)>0&&Number(r.layout_rows)>0&&Number(r.layout_columns)>0));
  const summary=seatingRoomCapacitySummary();
  const capacityOk=summary.benchCapacity>=summary.requiredBenches;
  const shortage=Math.max(0,summary.requiredBenches-summary.benchCapacity);
  const unselectedAvailable=available.filter(r=>!s.selectedRoomIds.has(r.id)).sort((a,b)=>Number(b.capacity||0)-Number(a.capacity||0));
  let additionalRooms=0,additionalBenchCapacity=0;
  for(const room of unselectedAvailable){
    if(additionalBenchCapacity>=shortage)break;
    additionalBenchCapacity+=Number(room.capacity||0);
    additionalRooms++;
  }
  const roomNeedText=capacityOk?'Selected rooms cover the required bench count.':(additionalRooms?('Need '+shortage+' more bench'+(shortage===1?'':'es')+'; add '+additionalRooms+' room'+(additionalRooms===1?'':'s')+'.'):('Need '+shortage+' more bench'+(shortage===1?'':'es')+'; no additional configured room is available.'));
  const roomCards=available.length?available.map(r=>{
    const checked=s.selectedRoomIds.has(r.id);
    const studentCapacity=Number(r.capacity||0)*Number(s.studentsPerBench||1);
    return '<label class="card" style="display:block;cursor:pointer;border-color:'+(checked?'#2457d6':'#e4e8ef')+';background:'+(checked?'#f7f9ff':'#fff')+'">'+
      '<div style="display:flex;align-items:flex-start;gap:10px">'+
      '<input type="checkbox" '+(checked?'checked':'')+' onchange="toggleSeatingRoom(\''+r.id+'\')" style="margin-top:3px;width:auto">'+
      '<div style="flex:1"><div style="display:flex;justify-content:space-between;gap:10px"><b>Room '+plannerEscape(r.room_number)+'</b><span class="badge">Available</span></div>'+
      '<div class="note">'+plannerEscape(r.room_name||'Unnamed room')+(r.floor?' · '+plannerEscape(r.floor):'')+'</div>'+
      '<div style="margin-top:10px;font-size:10px"><b>'+Number(r.capacity||0)+' benches</b> · '+Number(studentCapacity)+' student capacity · '+Number(r.layout_rows)+' × '+Number(r.layout_columns)+' layout</div></div></div></label>';
  }).join(''):'<div class="planner-empty">No available rooms with a configured physical layout were found for this session.</div>';
  const invalidNote=unavailable.length?'<div class="note" style="margin-top:12px">Rooms excluded from selection: '+unavailable.length+' unavailable or missing a valid physical layout.</div>':'';
  openModal('<div class="modalhead"><h2>Select Rooms</h2><button class="x" onclick="closeModal()">×</button></div>'+
    '<p>Select one or more available rooms for this exam date. Room capacity is measured in physical benches; the room layout must already be configured.</p>'+
    '<div class="cards" style="margin-bottom:16px"><div class="card"><div class="label">Candidates</div><div class="metric">'+summary.requiredStudents+'</div><div class="note">Unique candidates for '+plannerDateLabel(s.examDate)+'</div></div>'+
    '<div class="card"><div class="label">Required Benches</div><div class="metric">'+summary.requiredBenches+'</div><div class="note">'+(s.studentsPerBench===2?'Actual requirement after pairing rules · theoretical minimum '+summary.theoreticalRequiredBenches:'1 student per bench')+'</div></div>'+
    '<div class="card"><div class="label">Selected Benches</div><div class="metric" id="selectedBenchMetric">'+summary.benchCapacity+'</div><div class="note">Across selected rooms</div></div>'+
    '<div class="card"><div class="label">Capacity Check</div><div class="metric" id="roomCapacityMetric" style="font-size:20px">'+(capacityOk?'READY':'INSUFFICIENT')+'</div><div class="note" id="roomCapacityNote">'+roomNeedText+'</div></div></div>'+
    '<div class="card" style="margin-bottom:16px"><div class="cardhead"><h3 style="margin:0">Available Rooms</h3><span class="note">'+available.length+' configured room'+(available.length===1?'':'s')+'</span></div>'+
    '<div class="seating-room-grid">'+roomCards+'</div>'+invalidNote+'</div>'+
    '<div class="setup-note">'+(capacityOk?'Capacity is sufficient for the current seating configuration. ':'Capacity is currently short by '+shortage+' bench'+(shortage===1?'':'es')+'. ')+(s.studentsPerBench===2?'Theoretical minimum: '+summary.theoreticalRequiredBenches+' benches; current selected pairing configuration: '+summary.requiredBenches+' benches ('+summary.pairedCount+' paired, '+summary.singleCount+' single). ':'1 student per bench requires one physical bench per candidate. ')+(capacityOk?'Any same-subject or consecutive-class warning that the user explicitly enabled is treated as an allowed pairing; it is not treated as an error.':roomNeedText)+'</div>'+
    '<div style="text-align:right;margin-top:16px"><button class="btn" onclick="closeModal()">CANCEL</button><button class="btn primary" onclick="continueSeatingToGeneration()">CONTINUE TO SEATING GENERATION</button></div>');
}
function toggleSeatingRoom(roomId){
  const s=window.seatingRuleState;
  if(!s)return;
  if(s.selectedRoomIds.has(roomId))s.selectedRoomIds.delete(roomId);
  else s.selectedRoomIds.add(roomId);
  renderSeatingRoomSelection();
}
function continueSeatingToGeneration(){
  const s=window.seatingRuleState;
  if(!s)return toast('Seating configuration is not available.');
  const summary=seatingRoomCapacitySummary();
  if(!summary.selectedRooms.length)return toast('Select at least one room.');
  if(summary.benchCapacity<summary.requiredBenches)return toast('Selected room capacity is insufficient. Select additional rooms.');
  s.selectedRooms=summary.selectedRooms;
  renderSeatingGeneration();
}

function seatingCandidateSubjectSet(candidate){
  return new Set((candidate.subjectNames||[]).map(x=>String(x).trim().toLowerCase()).filter(Boolean));
}

function seatingPairAllowed(a,b){
  const s=window.seatingRuleState;
  if(!s||!a||!b||a.classId===b.classId)return false;
  const keyA=a.classId+'|'+b.classId;
  const keyB=b.classId+'|'+a.classId;
  return s.allowedPairs.has(keyA)||s.allowedPairs.has(keyB);
}

function buildSeatingBenches(){
  const s=window.seatingRuleState;
  if(!s)return{benches:[],pairedCount:0,singleCount:0};
  const candidates=[...(s.candidates||[])].sort((a,b)=>Number(a.classNumber)-Number(b.classNumber)||String(a.subjectName).localeCompare(String(b.subjectName))||String(a.sectionName).localeCompare(String(b.sectionName))||Number(a.rollNumber)-Number(b.rollNumber));
  const benches=[];
  const pairedKeys=new Set();
  const candidateByKey=new Map(candidates.map(x=>[x.key,x]));
  let pairedCount=0;
  if(Number(s.studentsPerBench)===1){
    candidates.forEach(candidate=>benches.push({students:[candidate],pairType:'single'}));
    return{benches,pairedCount:0,singleCount:benches.length};
  }

  const remaining=new Map(candidates.map(x=>[x.key,x]));
  while(remaining.size){
    const first=[...remaining.values()][0];
    let partner=null;
    const possible=[...remaining.values()].filter(x=>x.key!==first.key&&seatingPairAllowed(first,x));
    if(possible.length){
      possible.sort((a,b)=>Number(a.classNumber)-Number(b.classNumber)||String(a.subjectName).localeCompare(String(b.subjectName))||String(a.sectionName).localeCompare(String(b.sectionName))||Number(a.rollNumber)-Number(b.rollNumber));
      partner=possible[0];
    }
    if(partner){
      benches.push({students:[first,partner],pairType:'paired'});
      remaining.delete(first.key);
      remaining.delete(partner.key);
      pairedKeys.add(first.key);
      pairedKeys.add(partner.key);
      pairedCount++;
    }else{
      benches.push({students:[first],pairType:'single'});
      remaining.delete(first.key);
    }
  }
  const singleCount=benches.filter(x=>x.students.length===1).length;
  if(candidateByKey.size!==candidates.length)throw new Error('Duplicate candidate records were detected.');
  return{benches,pairedCount,singleCount};
}

function seatingPositionList(room){
  const rows=Number(room.layout_rows||0),columns=Number(room.layout_columns||0),capacity=Number(room.capacity||0);
  if(!Number.isInteger(rows)||rows<1||!Number.isInteger(columns)||columns<1||!Number.isInteger(capacity)||capacity<1||rows*columns<capacity)throw new Error('Room '+String(room.room_number||'')+' has an invalid physical layout or bench capacity.');
  const positions=[];
  // Column-wise numbering: fill all rows in Column 1 first, then move to Column 2, and so on.
  for(let column=1;column<=columns;column++){
    for(let row=1;row<=rows;row++){
      if(positions.length>=capacity)break;
      positions.push({row,column});
    }
  }
  return positions;
}

function seatingRoomNumberSort(a,b){
  const aText=String(a?.room_number??'').trim(),bText=String(b?.room_number??'').trim();
  const aNum=Number(aText),bNum=Number(bText);
  if(Number.isFinite(aNum)&&Number.isFinite(bNum)&&aNum!==bNum)return aNum-bNum;
  return aText.localeCompare(bText,undefined,{numeric:true,sensitivity:'base'});
}

function selectedSeatingRoomsInOrder(){
  const s=window.seatingRuleState;
  if(!s)return[];
  return [...(s.selectedRooms||[])].sort(seatingRoomNumberSort);
}

function generateSeatingPlan(){
  const s=window.seatingRuleState;
  if(!s)return null;
  const result=buildSeatingBenches();
  const selectedRooms=selectedSeatingRoomsInOrder();
  const positions=[];
  let benchCursor=0;
  const roomAllocation=[];

  // Fill each selected room to its configured physical bench capacity before using the next room.
  for(const room of selectedRooms){
    const capacity=Number(room.capacity||0);
    const roomPositions=seatingPositionList(room);
    if(roomPositions.length!==capacity)throw new Error('Room '+String(room.room_number||'')+' has '+roomPositions.length+' usable positions but a capacity of '+capacity+'.');
    const remaining=result.benches.length-benchCursor;
    const benchesForRoom=Math.min(capacity,Math.max(0,remaining));

    roomAllocation.push({
      roomId:room.id,
      roomNumber:room.room_number,
      capacity,
      positionsAvailable:roomPositions.length,
      benchesAssigned:benchesForRoom,
      full:benchesForRoom===capacity
    });

    for(let i=0;i<benchesForRoom;i++){
      positions.push({room,row:roomPositions[i].row,column:roomPositions[i].column});
    }
    benchCursor+=benchesForRoom;
    if(benchCursor>=result.benches.length)break;
  }

  if(benchCursor<result.benches.length)throw new Error('Selected rooms provide '+benchCursor+' usable bench positions, but '+result.benches.length+' benches are required after applying the seating rules. Select additional rooms.');

  const roomBenchCounters=new Map();
  const assignments=result.benches.map((bench,index)=>{
    const slot=positions[index];
    if(!slot)throw new Error('No physical bench position is available for generated bench '+(index+1)+'.');
    const nextBenchNumber=(roomBenchCounters.get(slot.room.id)||0)+1;
    roomBenchCounters.set(slot.room.id,nextBenchNumber);
    return{benchNumber:nextBenchNumber,roomId:slot.room.id,roomNumber:slot.room.room_number,roomName:slot.room.room_name||'',floor:slot.room.floor||'',row:slot.row,column:slot.column,students:bench.students};
  });

  const assignedKeys=assignments.flatMap(x=>x.students.map(y=>y.key));
  const uniqueAssigned=new Set(assignedKeys);
  if(uniqueAssigned.size!==assignedKeys.length)throw new Error('Seating generation created duplicate candidate assignments.');
  if(uniqueAssigned.size!==s.candidates.length)throw new Error('Seating generation did not assign every candidate.');
  assignments.forEach(x=>{if(x.students.length===2&&!seatingPairAllowed(x.students[0],x.students[1]))throw new Error('A generated two-student bench violates the configured pairing rules.');});
  return{...result,assignments,unusedPositions:positions.length-assignments.length,roomAllocation};
}

function seatingGenerationSummary(plan){
  const roomMap=new Map();
  plan.assignments.forEach(x=>{
    if(!roomMap.has(x.roomId))roomMap.set(x.roomId,{roomNumber:x.roomNumber,benches:0,students:0});
    const item=roomMap.get(x.roomId);
    item.benches++;
    item.students+=x.students.length;
  });
  return{rooms:roomMap.size,benches:plan.assignments.length,students:plan.assignments.reduce((n,x)=>n+x.students.length,0),paired:plan.pairedCount,singles:plan.singleCount,unused:plan.unusedPositions,roomMap};
}

function validateSeatingPlanS7(plan){
  const s=window.seatingRuleState;
  const errors=[];
  if(!s||!plan)errors.push('No generated seating plan is available.');
  if(!s?.candidates?.length)errors.push('No exam candidates were found.');
  const candidateMap=new Map((s?.candidates||[]).map(x=>[x.key,x]));
  const assignedKeys=plan?.assignments?.flatMap(a=>a.students.map(x=>x.key))||[];
  const uniqueKeys=new Set(assignedKeys);
  if(assignedKeys.length!==uniqueKeys.size)errors.push('Duplicate candidates detected in the generated seating plan.');
  if(uniqueKeys.size!==candidateMap.size)errors.push('The generated seating plan does not assign every candidate exactly once.');
  for(const key of candidateMap.keys())if(!uniqueKeys.has(key))errors.push('Missing candidate: '+key);
  const roomMap=new Map((s?.selectedRooms||[]).map(r=>[r.id,r]));
  const usedPositions=new Set();
  const usedBenchKeys=new Set();
  (plan?.assignments||[]).forEach(a=>{
    const room=roomMap.get(a.roomId);
    if(!room){errors.push('Assignment references a room that is not selected.');return;}
    const rows=Number(room.layout_rows||0),columns=Number(room.layout_columns||0),capacity=Number(room.capacity||0);
    if(a.row<1||a.row>rows||a.column<1||a.column>columns)errors.push('Assignment is outside the physical layout for Room '+room.room_number+'.');
    const positionKey=a.roomId+'|'+a.row+'|'+a.column;
    if(usedPositions.has(positionKey))errors.push('Duplicate physical bench position in Room '+room.room_number+'.');
    usedPositions.add(positionKey);
    const benchKey=a.roomId+'|'+a.benchNumber;
    if(usedBenchKeys.has(benchKey))errors.push('Duplicate bench number in Room '+room.room_number+'.');
    usedBenchKeys.add(benchKey);
    if((a.students||[]).length>Number(s.studentsPerBench||1))errors.push('A bench contains more students than configured.');
    if((a.students||[]).length===2&&!seatingPairAllowed(a.students[0],a.students[1]))errors.push('A two-student bench violates the selected pairing rules in Room '+room.room_number+'.');
    const positionNumber=(Number(a.column)-1)*rows+Number(a.row);
    if(positionNumber>capacity)errors.push('A student is assigned beyond the physical bench capacity of Room '+room.room_number+'.');
  });
  const roomBenchUsage=new Map();
  (plan?.assignments||[]).forEach(a=>roomBenchUsage.set(a.roomId,(roomBenchUsage.get(a.roomId)||0)+1));
  roomBenchUsage.forEach((used,roomId)=>{
    const room=roomMap.get(roomId);
    if(room&&used>Number(room.capacity||0))errors.push('Room '+room.room_number+' exceeds its physical bench capacity.');
  });
  return{valid:errors.length===0,errors:[...new Set(errors)]};
}

function renderSeatingValidation(plan){
  const result=validateSeatingPlanS7(plan);
  const items=[
    ['Candidate coverage',result.errors.some(x=>/candidate|Missing/i.test(x))?'FAIL':'PASS'],
    ['Physical room capacity',result.errors.some(x=>/capacity|layout|position/i.test(x))?'FAIL':'PASS'],
    ['Duplicate assignments',result.errors.some(x=>/duplicate/i.test(x))?'FAIL':'PASS'],
    ['Pairing rules',result.errors.some(x=>/pairing/i.test(x))?'FAIL':'PASS']
  ];
  const rows=items.map(x=>'<tr><td>'+x[0]+'</td><td><span class="badge" style="'+(x[1]==='PASS'?'background:#eef8f2;color:#218653':'background:#fff1f0;color:#b53a32')+'">'+x[1]+'</span></td></tr>').join('');
  const errorHtml=result.errors.length?'<div class="error-note" style="margin-top:12px">'+result.errors.map(x=>plannerEscape(x)).join('<br>')+'</div>':'<div class="setup-note" style="margin-top:12px">All validation checks passed. The seating plan is ready to be saved and published.</div>';
  openModal('<div class="modalhead"><h2>Seating Plan Validation</h2><button class="x" onclick="closeModal()">×</button></div>'+
    '<p>SeatChart validates candidate coverage, physical room capacity, duplicate assignments and the selected pairing rules before publishing.</p>'+
    '<div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Validation</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+errorHtml+'</div>'+
    '<div style="text-align:right;margin-top:16px"><button class="btn" onclick="closeModal()">CLOSE</button>'+(result.valid?'<button class="btn primary" onclick="saveAndPublishSeatingPlan()">SAVE &amp; PUBLISH</button>':'')+'</div>');
  return result;
}

async function saveAndPublishSeatingPlan(){
  const s=window.seatingRuleState;
  if(!s?.generatedPlan)return toast('Generate the seating plan first.');
  const validation=validateSeatingPlanS7(s.generatedPlan);
  if(!validation.valid){toast('Seating plan validation failed.');renderSeatingValidation(s.generatedPlan);return;}
  try{
    const existingRes=await db.from('sc_seating_plans').select('id,status').eq('school_id',APP.schoolId).eq('exam_id',s.examId).eq('exam_date',s.examDate).maybeSingle();
    if(existingRes.error)throw existingRes.error;
    if(existingRes.data?.status==='Published')return toast('A published seating plan already exists for this exam date.');
    let planId=existingRes.data?.id;
    if(planId){
      const updateRes=await db.from('sc_seating_plans').update({students_per_bench:Number(s.studentsPerBench),status:'Draft',updated_at:new Date().toISOString(),published_at:null}).eq('id',planId).eq('school_id',APP.schoolId);
      if(updateRes.error)throw updateRes.error;
      const delRes=await db.from('sc_seating_assignments').delete().eq('seating_plan_id',planId).eq('school_id',APP.schoolId);
      if(delRes.error)throw delRes.error;
    }else{
      const insertRes=await db.from('sc_seating_plans').insert({school_id:APP.schoolId,exam_id:s.examId,exam_date:s.examDate,students_per_bench:Number(s.studentsPerBench),status:'Draft'}).select('id').single();
      if(insertRes.error)throw insertRes.error;
      planId=insertRes.data.id;
    }
    const rows=[];
    s.generatedPlan.assignments.forEach(a=>a.students.forEach((student,index)=>rows.push({
      school_id:APP.schoolId,seating_plan_id:planId,room_id:a.roomId,row_number:a.row,column_number:a.column,bench_number:a.benchNumber,seat_position:index+1,class_id:student.classId,section_id:student.sectionId,roll_number:Number(student.rollNumber),subject_names:student.subjectName||''
    })));
    for(let i=0;i<rows.length;i+=500){
      const res=await db.from('sc_seating_assignments').insert(rows.slice(i,i+500));
      if(res.error)throw res.error;
    }
    const publishRes=await db.from('sc_seating_plans').update({status:'Published',published_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',planId).eq('school_id',APP.schoolId);
    if(publishRes.error)throw publishRes.error;
    s.publishedPlanId=planId;
    closeModal();
    toast('Seating plan validated and published successfully.');
  }catch(e){
    console.error('saveAndPublishSeatingPlan failed',e);
    toast(e.message||'Unable to publish seating plan');
  }
}

function seatingClassLabel(classNumber){
  const n=Number(classNumber);
  const labels={1:'I',2:'II',3:'III',4:'IV',5:'V',6:'VI',7:'VII',8:'VIII',9:'IX',10:'X',11:'XI',12:'XII'};
  return labels[n]||String(n);
}
function seatingClassSectionLabel(classNumber,sectionName){
  const cls=seatingClassLabel(classNumber),section=String(sectionName||'').trim();
  return section?cls+'-'+section:cls;
}
function consolidateSeatingSubjects(assignments){
  const map=new Map();
  assignments.forEach(a=>a.students.forEach(student=>{
    const key=student.classId+'|'+student.sectionId+'|'+student.subjectName;
    if(!map.has(key))map.set(key,{classNumber:student.classNumber,sectionName:student.sectionName,subjectName:student.subjectName,rolls:[]});
    map.get(key).rolls.push(Number(student.rollNumber));
  }));
  const rangeText=rolls=>{
    const sorted=[...new Set(rolls)].sort((a,b)=>a-b);
    if(!sorted.length)return '';
    const ranges=[];let start=sorted[0],prev=sorted[0];
    for(let i=1;i<sorted.length;i++){
      if(sorted[i]===prev+1){prev=sorted[i];continue;}
      ranges.push(start===prev?String(start):start+'-'+prev);start=prev=sorted[i];
    }
    ranges.push(start===prev?String(start):start+'-'+prev);
    return ranges.join(', ');
  };
  return [...map.values()].sort((a,b)=>
    Number(a.classNumber)-Number(b.classNumber)||
    String(a.sectionName).localeCompare(String(b.sectionName))||
    String(a.subjectName).localeCompare(String(b.subjectName))
  ).map(x=>({
    classNumber:x.classNumber,
    sectionName:x.sectionName,
    subjectName:x.subjectName,
    rollText:rangeText(x.rolls)
  }));
}
function renderPhysicalSeatingChart(){
  const s=window.seatingRuleState,plan=s?.generatedPlan;
  if(!s||!plan)return toast('Generate the seating plan first.');
  try{
    const rooms=new Map();
    (s.selectedRooms||[]).forEach(room=>rooms.set(room.id,{room,assignments:[]}));
    plan.assignments.forEach(a=>{if(rooms.has(a.roomId))rooms.get(a.roomId).assignments.push(a);});
    const usedRooms=[...rooms.values()].filter(x=>x.assignments.length);
    const roomSections=usedRooms.map(item=>{
      const room=item.room,rows=Number(room.layout_rows||0),columns=Number(room.layout_columns||0),capacity=Number(room.capacity||0);
      const roomAssignments=[...item.assignments];
      const assignmentMap=new Map(roomAssignments.map(a=>[a.row+'|'+a.column,a]));
      const benchNumberByPosition=new Map();
      seatingPositionList(room).forEach((position,index)=>benchNumberByPosition.set(position.row+'|'+position.column,index+1));
      let grid='';
      for(let row=1;row<=rows;row++){
        grid+='<tr><th>Row '+row+'</th>';
        for(let col=1;col<=columns;col++){
          const benchNumber=benchNumberByPosition.get(row+'|'+col)||0,a=assignmentMap.get(row+'|'+col);
          if(!benchNumber)grid+='<td class="seat-unused">—</td>';
          else if(a){
            const rollText=a.students.map(y=>y.rollNumber+' ('+seatingClassSectionLabel(y.classNumber,y.sectionName)+')').join(' , ');
            grid+='<td class="seat-occupied"><b>'+benchNumber+'</b><div class="seat-roll">'+plannerEscape(rollText)+'</div></td>';
          }else{
            grid+='<td class="seat-empty"><b>'+benchNumber+'</b><div>—</div></td>';
          }
        }
        grid+='</tr>';
      }
      const roomSummary=consolidateSeatingSubjects(roomAssignments).map(x=>
        '<tr><td>'+plannerEscape(seatingClassSectionLabel(x.classNumber,x.sectionName))+'</td><td>'+plannerEscape(x.subjectName)+'</td><td>'+plannerEscape(x.rollText)+'</td></tr>'
      ).join('');
      return '<div class="card physical-room-chart"><div class="cardhead"><div><h3 style="margin:0">Room '+plannerEscape(room.room_number)+'</h3><div class="note">'+plannerEscape(room.room_name||'Unnamed room')+(room.floor?' · '+plannerEscape(room.floor):'')+' · '+rows+' × '+columns+' · '+capacity+' benches</div></div><span class="badge">'+roomAssignments.length+' benches used</span></div>'+
        '<div class="card" style="margin:0 0 12px"><div class="cardhead"><h4 style="margin:0">Room Candidate List</h4><span class="note">Class / Section · Subject · Roll Numbers</span></div><div class="tablewrap"><table class="table"><thead><tr><th>Class / Section</th><th>Subject</th><th>Roll Numbers</th></tr></thead><tbody>'+roomSummary+'</tbody></table></div></div>'+
        '<div class="tablewrap"><table class="seat-layout-table"><tbody>'+grid+'</tbody></table></div></div>';
    }).join('');
    openModal('<div class="modalhead"><h2>Physical Seating Chart</h2><button class="x" onclick="closeModal()">×</button></div>'+
      '<p>'+plannerDateLabel(s.examDate)+' · '+s.candidates.length+' candidates · '+usedRooms.length+' rooms used.</p>'+
      '<div class="setup-note" style="margin-bottom:16px"><b>Seat format:</b> Each room starts its bench numbering from <b>1</b>. Each student is shown as <b>Roll (Class-Section)</b>, for example <b>14 (X-A)</b> or <b>22 (III-B)</b>.</div>'+
      roomSections+
      '<div style="text-align:right;margin-top:16px"><button class="btn" onclick="closeModal()">CLOSE</button></div>');
  }catch(e){console.error('renderPhysicalSeatingChart failed',e);toast(e.message||'Unable to render physical seating chart');}
}

function previewSchoolLogo(input){

function schoolLogoStoragePathFromUrl(url){
  const marker='/storage/v1/object/public/school-logos/';
  const value=String(url||'');
  const index=value.indexOf(marker);
  return index===-1?null:value.slice(index+marker.length).split('?')[0];
}
async function saveSchoolProfile(){
  const btn=document.getElementById('saveSchoolProfileBtn');
  const name=String(document.getElementById('schoolProfileName')?.value||'').trim();
  const address=String(document.getElementById('schoolProfileAddress')?.value||'').trim();
  const phoneRaw=String(document.getElementById('schoolProfilePhone')?.value||'').trim();
  const phone=phoneRaw?normalizePhone(phoneRaw):null;
  const file=document.getElementById('schoolProfileLogoFile')?.files?.[0]||null;
  const previousLogoUrl=String(APP.profile?.sc_schools?.logo_url||'').trim()||null;
  if(!name)return toast('School name is required.');
  if(phone && !/^\+91\d{10}$/.test(phone))return toast('Enter a valid 10-digit Indian mobile number.');
  if(file){
    if(!['image/png','image/jpeg','image/webp'].includes(file.type))return toast('Logo must be PNG, JPG or WEBP.');
    if(file.size>2*1024*1024)return toast('Logo must be 2 MB or smaller.');
  }
  if(btn){btn.disabled=true;btn.textContent=file?'UPLOADING…':'SAVING…';}
  let uploadedPath=null;
  try{
    let logoUrl=previousLogoUrl;
    if(file){
      const extension=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';
      uploadedPath=APP.schoolId+'/logo-'+Date.now()+'.'+extension;
      const upload=await db.storage.from('school-logos').upload(uploadedPath,file,{cacheControl:'3600',contentType:file.type,upsert:false});
      if(upload.error)throw upload.error;
      const publicResult=db.storage.from('school-logos').getPublicUrl(uploadedPath);
      logoUrl=publicResult?.data?.publicUrl||null;
      if(!logoUrl)throw new Error('Unable to create the school logo URL.');
    }
    const {data,error}=await db.from('sc_schools').update({name,address:address||null,phone,logo_url:logoUrl,updated_at:new Date().toISOString()}).eq('id',APP.schoolId).select('id,name,address,phone,logo_url,updated_at').single();
    if(error)throw error;
    if(file&&previousLogoUrl){
      const previousPath=schoolLogoStoragePathFromUrl(previousLogoUrl);
      if(previousPath&&previousPath.startsWith(APP.schoolId+'/'))await db.storage.from('school-logos').remove([previousPath]);
    }
    APP.profile.sc_schools={...(APP.profile.sc_schools||{}),...data};
    document.getElementById('sideSchool').textContent=data.name||'';
    closeModal();
    toast('School information updated successfully.');
    go('profile');
    await logHistory('Updated','School',data.id,file?'Updated school profile information and logo':'Updated school profile information');
  }catch(e){
    console.error('saveSchoolProfile failed',e);
    if(uploadedPath)await db.storage.from('school-logos').remove([uploadedPath]);
    toast(e.message||'Unable to update school information.');
    if(btn){btn.disabled=false;btn.textContent='SAVE CHANGES';}
  }
}

function validateRoomImportRows(rows){const seenNumbers=new Set();for(let i=0;i<rows.length;i++){const r=rows[i],number=String(r['Room Number']??r.room_number??r.Room??'').trim(),rowsValue=r.Rows??r.rows??r['Layout Rows']??'',colsValue=r.Columns??r.columns??r['Layout Columns']??'',capacityValue=r.Capacity??r.capacity??'',layoutRows=Number(rowsValue),layoutColumns=Number(colsValue),capacity=capacityValue===''?null:Number(capacityValue);if(!number)throw new Error('Row '+(i+2)+': Room Number is required.');if(!Number.isInteger(capacity)||capacity<1||capacity>99)throw new Error('Row '+(i+2)+': Capacity must be a whole number from 1 to 99.');if(!Number.isInteger(layoutRows)||layoutRows<1||layoutRows>99)throw new Error('Row '+(i+2)+': Rows must be a whole number from 1 to 99.');if(!Number.isInteger(layoutColumns)||layoutColumns<1||layoutColumns>99)throw new Error('Row '+(i+2)+': Columns must be a whole number from 1 to 99.');const calculated=layoutRows*layoutColumns;if(calculated<capacity)throw new Error('Row '+(i+2)+': Rows × Columns must cover all physical benches ('+capacity+').');const rk=number.toLowerCase();if(seenNumbers.has(rk))throw new Error('Duplicate room number found in row '+(i+2)+'.');seenNumbers.add(rk)}}
async function importSubjects(rows){validateSubjectImportRows(rows);const classes=await db.from('sc_classes').select('id,class_number').eq('school_id',APP.schoolId).eq('session_id',APP.sessionId);if(classes.error)throw classes.error;const classMap=new Map((classes.data||[]).map(x=>[Number(x.class_number),x.id]));const existing=await db.from('sc_subjects').select('id,class_id,subject_name').eq('school_id',APP.schoolId).eq('session_id',APP.sessionId);if(existing.error)throw existing.error;const existingMap=new Map((existing.data||[]).map(x=>[x.class_id+'|'+String(x.subject_name||'').trim().toLowerCase(),x.id]));for(const r of rows){const cls=Number(r.Class??r.class??r['Class Number']),name=String(r.Subject??r.subject??r['Subject Name']??'').trim(),status=String(r.Status??r.status??'Active').trim()||'Active',classId=classMap.get(cls);if(!classId)throw new Error('Class '+cls+' does not exist in the current session.');const key=classId+'|'+name.toLowerCase(),payload={school_id:APP.schoolId,session_id:APP.sessionId,class_id:classId,subject_name:name,status},existingId=existingMap.get(key);if(existingId){const result=await db.from('sc_subjects').update(payload).eq('id',existingId);if(result.error)throw result.error}else{const result=await db.from('sc_subjects').insert(payload).select('id').single();if(result.error)throw result.error;await initializeSubjectRollsDb(result.data.id,classId)}}await logHistory('Imported','Subjects',null,'Excel subject import with existing subject overwrite')}
async function importRooms(rows){validateRoomImportRows(rows);const existing=await db.from('sc_rooms').select('id,room_number').eq('school_id',APP.schoolId).eq('session_id',APP.sessionId);if(existing.error)throw existing.error;const existingMap=new Map((existing.data||[]).filter(x=>x.room_number).map(x=>[x.room_number.trim().toLowerCase(),x.id]));for(const r of rows){const roomNumber=String(r['Room Number']??r.room_number??r.Room??'').trim(),layoutRows=Number(r.Rows??r.rows??r['Layout Rows']),layoutColumns=Number(r.Columns??r.columns??r['Layout Columns']),capacity=Number(r.Capacity??r.capacity),roomName=String(r['Room Name']??r.room_name??'').trim(),floor=String(r.Floor??r.floor??'').trim(),existingId=existingMap.get(roomNumber.toLowerCase()),payload={school_id:APP.schoolId,session_id:APP.sessionId,room_name:roomName,room_number:roomNumber,capacity,floor,status:'Available',layout_rows:layoutRows,layout_columns:layoutColumns};const result=existingId?await db.from('sc_rooms').update(payload).eq('id',existingId):await db.from('sc_rooms').insert(payload);if(result.error)throw result.error}await logHistory('Imported','Rooms',null,'Excel room import with physical layout')}
async function logout(){clearTimeout(__scLogoutTimer);clearInterval(__scRefreshTimer);await db.auth.signOut();location.reload()}
async function logHistory(action,type,id,description){try{await db.from('sc_history').insert({school_id:APP.schoolId,user_id:APP.user.id,action,entity_type:type,entity_id:id||null,description})}catch(e){}}
document.getElementById('modalbg').onclick=e=>{if(e.target.id==='modalbg')closeModal()};
window.addEventListener('load',async()=>{initCtaLoading();const {data:{user}}=await db.auth.getUser();if(user){await bootstrap()}else{showAuth('login')}});
</script>
