px}.section:first-child{border-top:0;padding-top:0;margin-top:0}.sectitle{font-size:9px;color:#737e91;font-weight:800;letter-spacing:.7px;margin-bottom:12px}.check{display:flex;gap:8px;font-size:10px;color:var(--muted);align-items:flex-start;margin:12px 0}.check input{width:auto}.timeline{border-left:2px solid #e7ebf2;margin-left:8px;padding-left:22px}.event{position:relative;padding:0 0 22px}.event:before{content:"";position:absolute;left:-29px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--p);border:3px solid var(--bg)}.event time{font-size:9px;color:#8a94a5}.event b{display:block;font-size:11px;margin-top:3px}.event span{font-size:9px;color:var(--muted)}.calendar{background:#fff;border:1px solid var(--line);border-radius:11px;overflow:auto}.calhead{display:flex;justify-content:space-between;padding:15px;border-bottom:1px solid var(--line);align-items:center}.calgrid{display:grid;grid-template-columns:repeat(7,minmax(105px,1fr));min-width:735px}.calgrid>div{min-height:90px;border-right:1px solid #eef1f5;border-bottom:1px solid #eef1f5;padding:8px;font-size:10px}.dayname{min-height:auto!important;font-size:9px!important;color:#7b869a;text-transform:uppercase;font-weight:800}.daynum{font-weight:750;font-size:11px}.eventchip{background:#eff3ff;color:var(--p);border-radius:7px;padding:6px;margin-top:8px;font-size:8px}.login{min-height:100vh;display:grid;place-items:center;padding:22px}.loginbox{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:15px;padding:25px}.loginbrand{display:flex;align-items:center;gap:10px;margin-bottom:18px}.error-note{background:#fff0f0;color:#a93232;border:1px solid #ffd2d2;border-radius:8px;padding:9px;font-size:10px;margin-bottom:13px}.setup-note{background:#f3f7ff;color:#50627e;border:1px solid #d7e3ff;border-radius:8px;padding:10px;font-size:10px;margin:10px 0}.roll-tools{display:flex;gap:8px;margin-bottom:10px}.roll-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.roll-check{display:flex;align-items:center;gap:3px;font-size:9px}.roll-check input{width:auto}.mobile-nav{display:none}
@media(max-width:900px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.hamb{display:block}.header{padding:0 15px}.headright .profile .uname,.headright .profile .school{display:none}.content{padding:18px}.cards{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.mobile-nav{position:fixed;bottom:0;left:0;right:0;height:62px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:15}.mobile-nav button{border:0;background:none;color:#69748a;font-size:9px}.mobile-nav button.active{color:var(--p)}.mobile-nav .mi{display:block;font-size:16px;margin-bottom:2px}.content{padding-bottom:82px}}

const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const APP={user:null,schoolId:null,sessionId:null,profile:null};
function authError(msg){document.getElementById('authError').innerHTML=`<div class="error-note">${msg}</div>`}
function normalizePhone(v){v=String(v||'').replace(/\D/g,'');return v.length===10?'+91'+v:v}
function loginForm(){return `<div class="field"><label>Phone Number *</label><input id="authPhone" maxlength="10" inputmode="numeric" placeholder="10 digit number"></div><div class="field"><label>6-Digit PIN *</label><input id="authPin" type="password" maxlength="6" inputmode="numeric" placeholder="••••••"></div><button class="btn primary" style="width:100%" onclick="loginReal()">LOGIN</button><button class="btn" style="width:100%;margin-top:8px" onclick="showAuth('signup')">CREATE NEW SCHOOL ACCOUNT</button>`}
function signupForm(){return `<div class="split"><div class="field"><label>Administrator Full Name *</label><input id="suName" placeholder="Full name"></div><div class="field"><label>Phone Number *</label><input id="suPhone" maxlength="10" inputmode="numeric" placeholder="10 digit number"></div></div><div class="field"><label>School Name *</label><input id="suSchool" placeholder="School name"></div><div class="field"><label>School Address</label><textarea id="suAddress" rows="2" placeholder="Optional"></textarea></div><div class="split"><div class="field"><label>6-Digit PIN *</label><input id="suPin" type="password" maxlength="6" inputmode="numeric"></div><div class="field"><label>Confirm PIN *</label><input id="suPin2" type="password" maxlength="6" inputmode="numeric"></div></div><div style="margin-top:12px"><button class="btn primary" style="width:100%" onclick="signupReal()">CREATE ACCOUNT</button><button class="btn" style="width:100%;margin-top:8px" onclick="showAuth('login')">← BACK TO LOGIN</button></div>`}
function showAuth(mode){document.body.innerHTML=`<div class="login"><div class="loginbox"><div class="loginbrand"><div class="mark">SC</div><div><div style="font-weight:800;font-size:18px">SeatChart</div><div style="font-size:8px;color:#6d778b;letter-spacing:.7px">SCHOOL EXAMINATION & SEATING MANAGEMENT</div></div></div><h2 style="margin:0 0 5px">${mode==='login'?'Sign in to SeatChart':'Create SeatChart Account'}</h2><p style="font-size:11px;color:#6d778b;margin:0 0 18px">${mode==='login'?'Use your school phone number and 6-digit PIN.':'Create the administrator account for one school.'}</p><div id="authError"></div><div id="authForm">${mode==='login'?loginForm():signupForm()}</div></div></div>`}
function accountEmail(phone){return phone.replace(/\D/g,'')+'@login.seatchart.app'}
async function loginReal(){const phone=normalizePhone(document.getElementById('authPhone').value),pin=document.getElementById('authPin').value;if(!/^\+91\d{10}$/.test(phone)||!/^[0-9]{6}$/.test(pin))return authError('Enter a valid 10-digit Indian phone number and 6-digit PIN.');const {data,error}=await db.auth.signInWithPassword({email:accountEmail(phone),password:pin});if(error)return authError(error.message);await bootstrap()}
async function signupReal(){const name=document.getElementById('suName').value.trim(),phone=normalizePhone(document.getElementById('suPhone').value),school=document.getElementById('suSchool').value.trim(),address=document.getElementById('suAddress').value.trim(),pin=document.getElementById('suPin').value,pin2=document.getElementById('suPin2').value;if(!name||!school||!/^[0-9]{6}$/.test(pin)||pin!==pin2||!/^\+91\d{10}$/.test(phone))return authError('Please complete all required fields and use a matching 6-digit PIN.');const {data,error}=await db.auth.signUp({email:accountEmail(phone),password:pin});if(error)return authError(error.message);if(!data.session)return authError('Account created, but Supabase email confirmation is enabled. Disable email confirmation for the no-email workflow.');const uid=data.user.id;const schoolId=crypto.randomUUID();let r=await db.from('sc_schools').insert({id:schoolId,name:school,address:address||null,phone,created_by:uid});if(r.error){await db.auth.signOut();showAuth('signup');return authError(r.error.message)}r=await db.from('sc_user_profiles').insert({id:uid,school_id:schoolId,full_name:name,phone,role:'Administrator'});if(r.error){await db.auth.signOut();showAuth('signup');return authError(r.error.message)}const session=await ensureCurrentSession(schoolId);if(!session){await db.auth.signOut();showAuth('signup');return authError('Unable to create the academic session. Please try again.')}await bootstrap()}
async function ensureCurrentSession(schoolId){const now=new Date(),startYear=now.getMonth()>=3?now.getFullYear():now.getFullYear()-1,endYear=startYear+1,name=`${startYear}–${String(endYear).slice(-2)}`;let {data}=await db.from('sc_academic_sessions').select('*').eq('school_id',schoolId).eq('session_name',name).maybeSingle();if(!data){let r=await db.from('sc_academic_sessions').insert({school_id:schoolId,session_name:name,start_date:`${startYear}-04-01`,end_date:`${endYear}-03-31`,is_current:true}).select('*').single();data=r.data}return data}
async function bootstrap(){const {data:{user}}=await db.auth.getUser();if(!user){showAuth('login');return}APP.user=user;let r=await db.from('sc_user_profiles').select('*,sc_schools(*)').eq('id',user.id).single();if(r.error){await db.auth.signOut();showAuth('login');return authError('Your SeatChart account is not fully set up yet. Please sign in again after completing account setup.')}APP.profile=r.data;APP.schoolId=r.data.school_id;const s=await ensureCurrentSession(APP.schoolId);if(!s||!s.id){await db.auth.signOut();showAuth('login');return authError('Academic session could not be loaded. Please try again.')}APP.sessionId=s.id;renderApp();go('dashboard')}
function renderApp(){document.body.innerHTML=`<div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="mark">SC</div><div><b>SeatChart</b><small>SCHOOL EXAMINATION & SEATING MANAGEMENT</small></div></div><nav class="nav"><div class="navlabel">ACADEMIC SETUP</div><a href="#dashboard" onclick="go('dashboard')" id="nav-dashboard"><span class="ni">⌂</span>Dashboard</a><a href="#classes" onclick="go('classes')" id="nav-classes"><span class="ni">▦</span>Classes & Sections</a><a href="#rooms" onclick="go('rooms')" id="nav-rooms"><span class="ni">⌑</span>Rooms</a><a href="#subjects" onclick="go('subjects')" id="nav-subjects"><span class="ni">◈</span>Subjects</a><div class="navlabel">EXAMINATION</div><a href="#planner" onclick="go('planner')" id="nav-planner"><span class="ni">◫</span>Exam Planner</a><a href="#exams" onclick="go('exams')" id="nav-exams"><span class="ni">▣</span>Exams</a><div class="navlabel">SETTINGS</div><a href="#users" onclick="go('users')" id="nav-users"><span class="ni">◉</span>User Management</a><a href="#history" onclick="go('history')" id="nav-history"><span class="ni">◷</span>History</a><a href="#profile" onclick="go('profile')" id="nav-profile"><span class="ni">⚙</span>Profile Management</a></nav><div class="sideuser"><div class="user"><div class="avatar" id="sideAvatar">GS</div><div><div class="uname" id="sideName">Gunjit Singh</div><div class="school" id="sideSchool">ABC Public School</div></div><button class="btn" style="margin-left:auto;padding:6px 8px" onclick="logout()">↪</button></div></div></aside><main class="main"><header class="header"><div><button class="hamb" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><span class="headtitle" id="pageTitle">Dashboard</span></div><div class="headright"><div class="profile"><div class="avatar" id="headAvatar">GS</div><span id="headName">Gunjit Singh</span></div></div></header><section id="view" class="content"></section></main><nav class="mobile-nav"><button onclick="go('dashboard')"><span class="mi">⌂</span>Dashboard</button><button onclick="go('classes')"><span class="mi">▦</span>Classes</button><button onclick="go('rooms')"><span class="mi">⌑</span>Rooms</button><button onclick="go('subjects')"><span class="mi">◈</span>Subjects</button></nav><div class="modalbg" id="modalbg"><div class="modal" id="modal"></div></div><div id="toast" style="display:none;position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:11px 14px;border-radius:8px;font-size:11px;z-index:80"></div></div>`;const p=APP.profile;document.getElementById('sideName').textContent=p.full_name||'';document.getElementById('sideSchool').textContent=p.sc_schools?.name||'';document.getElementById('headName').textContent=p.full_name||'';const ini=(p.full_name||'SC').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();document.getElementById('sideAvatar').textContent=ini;document.getElementById('headAvatar').textContent=ini;document.getElementById('modalbg').onclick=function(e){if(e.target.id==='modalbg')closeModal()}}
const titles={dashboard:'Dashboard',classes:'Classes & Sections',rooms:'Rooms',subjects:'Subjects',planner:'Exam Planner',exams:'Exams',users:'User Management',history:'History',profile:'Profile Management'};
function go(page){if(!APP.user)return;document.getElementById('pageTitle').textContent=titles[page]||'Dashboard';document.querySelectorAll('.nav a').forEach(x=>x.classList.remove('active'));document.getElementById('nav-'+page)?.classList.add('active');const v=document.getElementById('view');if(page==='dashboard'){v.innerHTML=dashboardHtml();loadDashboardStats()}if(page==='classes')loadClasses();if(page==='rooms')loadRooms();if(page==='subjects')loadSubjects();if(page==='planner')v.innerHTML=plannerHtml();if(page==='exams')v.innerHTML=examsHtml();if(page==='users')v.innerHTML=usersHtml();if(page==='history')loadHistory();if(page==='profile')v.innerHTML=profileHtml()}

async function loadDashboardStats(){const [sections,rooms]=await Promise.all([db.from('sc_sections').select('student_count').eq('school_id',APP.schoolId),db.from('sc_rooms').select('id',{count:'exact',head:true}).eq('school_id',APP.schoolId).eq('session_id',APP.sessionId)]);if(document.getElementById('dashStudents'))document.getElementById('dashStudents').textContent=(sections.data||[]).reduce((sum,s)=>sum+Number(s.student_count||0),0);if(document.getElementById('dashRooms'))document.getElementById('dashRooms').textContent=rooms.count??0;if(document.getElementById('dashUpcomingExams'))document.getElementById('dashUpcomingExams').textContent=0;if(document.getElementById('dashSeatingStatus'))document.getElementById('dashSeatingStatus').textContent='0 / 0'}

async function loadClasses(){const v=document.getElementById('view');v.innerHTML='<div class="card">Loading classes…</div>';const {data,error}=await db.from('sc_classes').select('*,sc_sections(*)').eq('school_id',APP.schoolId).eq('session_id',APP.sessionId).order('class_number');if(error)return v.innerHTML=`<div class="card error-note">${error.message}</div>`;v.innerHTML=classesHtml(data||[])}

async function saveClassDb(){const cls=Number(document.getElementById('dbClass').value),n=Number(document.getElementById('dbSecCount').value);let r=await db.from('sc_classes').upsert({school_id:APP.schoolId,session_id:APP.sessionId,class_number:cls},{onConflict:'school_id,session_id,class_number'}).select('id').single();if(r.error)return toast(r.error.message);for(let i=0;i<n;i++){const count=Number(document.getElementById('student_'+i).value);if(!Number.isInteger(count)||count<1||count>99)return toast('Student count must be between 1 and 99.');const e=await db.from('sc_sections').upsert({school_id:APP.schoolId,class_id:r.data.id,section_name:String.fromCharCode(65+i),student_count:count},{onConflict:'class_id,section_name'});if(e.error)return toast(e.error.message)}await logHistory('Created','Class',r.data.id,`Class ${cls}`);closeModal();toast('Class saved');loadClasses()}
async function editClassDb(id){

function drawEditSectionFields(existing){

async function saveEditedClass(id){
const {data,error}=await db.from('sc_classes').select('*,sc_sections(*)').eq('id',id).single();
if(error)return toast(error.message);
const cls=Number(document.getElementById('editClassNo').value),n=Number(document.getElementById('editSecCount').value),existing=data.sc_sections||[];for(let i=0;i<n;i++){const count=Number(document.getElementById('editStudent_'+i).value);if(!Number.isInteger(count)||count<1||count>99)return toast('Student count must be between 1 and 99.');}
const removed=existing.filter(x=>x.section_name>String.fromCharCode(64+n));
if(removed.length){const rr=await db.from('sc_subject_rolls').select('id').in('section_id',removed.map(x=>x.id)).limit(1);if(rr.data?.length)return toast('A section being removed has roll-number assignments. Remove those assignments first.');}
const u=await db.from('sc_classes').update({class_number:cls}).eq('id',id);if(u.error)return toast(u.error.message);
for(let i=0;i<n;i++){const name=String.fromCharCode(65+i),old=existing.find(x=>x.section_name===name),count=Number(document.getElementById('editStudent_'+i).value||0);const e=old?await db.from('sc_sections').update({student_count:count}).eq('id',old.id):await db.from('sc_sections').insert({school_id:APP.schoolId,class_id:id,section_name:name,student_count:count});if(e.error)return toast(e.error.message)}
if(removed.length){const e=await db.from('sc_sections').delete().in('id',removed.map(x=>x.id));if(e.error)return toast(e.error.message)}
await logHistory('Updated','Class',id,'Class '+cls+' and sections updated');closeModal();toast('Class updated');loadClasses()
}
async function manageSectionsDb(classId,classNo){
const r=await db.from('sc_sections').select('id,section_name,student_count').eq('class_id',classId).order('section_name');
if(r.error)return toast(r.error.message);
openModal(`<div class="modalhead"><h2>Class ${classNo} — Sections</h2><button class="x" onclick="closeModal()">×</button></div><p>Manage sections individually. Student counts can be changed from Edit Class.</p><div class="tablewrap"><table class="table"><thead><tr><th>Section</th><th>Students</th><th>Action</th></tr></thead><tbody>${(r.data||[]).map(s=>`<tr><td>Section ${s.section_name}</td><td>${s.student_count}</td><td><button class="btn danger" onclick="deleteSectionDb('${s.id}',${classNo},'${s.section_name}')">Delete</button></td></tr>`).join('')}</tbody></table></div><div style="text-align:right;margin-top:15px"><button class="btn" onclick="closeModal()">CLOSE</button></div>`);
}
async function deleteSectionDb(sectionId,classNo,sectionName){
if(!confirm('Delete Section '+sectionName+' from Class '+classNo+'? This cannot be undone.'))return;
const rr=await db.from('sc_subject_rolls').select('id').eq('section_id',sectionId).limit(1);
if(rr.error)return toast(rr.error.message);
if(rr.data?.length)return toast('Section '+sectionName+' has roll-number assignments. Remove those assignments before deleting the section.');
const d=await db.from('sc_sections').delete().eq('id',sectionId);
if(d.error)return toast(d.error.message);
await logHistory('Deleted','Section',sectionId,'Section '+sectionName+' deleted from Class '+classNo);
closeModal();toast('Section '+sectionName+' deleted');loadClasses()
}
async function deleteClassDb(id,classNo){
if(!confirm('Delete Class '+classNo+' and all its sections? This cannot be undone.'))return;
const sub=await db.from('sc_subjects').select('id').eq('class_id',id).limit(1);if(sub.data?.length)return toast('Class '+classNo+' has subjects mapped to it. Remove those subjects before deleting the class.');
const sections=await db.from('sc_sections').select('id').eq('class_id',id);if(sections.error)return toast(sections.error.message);
const ids=(sections.data||[]).map(x=>x.id);
if(ids.length){const rolls=await db.from('sc_subject_rolls').select('id').in('section_id',ids).limit(1);if(rolls.data?.length)return toast('This class has roll-number assignments. Remove them before deleting the class.');const e=await db.from('sc_sections').delete().in('id',ids);if(e.error)return toast(e.error.message)}
const e=await db.from('sc_classes').delete().eq('id',id);if(e.error)return toast(e.error.message);
await logHistory('Deleted','Class',id,'Class '+classNo+' deleted');toast('Class '+classNo+' deleted');loadClasses()
}
function roomsHtml(rows){const total=(rows||[]).length,available=(rows||[]).filter(r=>r.status==='Available').length,unavailable=total-available,benches=(rows||[]).filter(r=>r.status==='Available').reduce((a,r)=>a+Number(r.capacity||0),0),capacity=benches*2;return `<div class="top"><div><h1>Rooms</h1><p>Manage exam rooms, bench capacity, floors and availability for the current session.</p></div><div class="actions"><button class="btn" onclick="downloadRoomTemplate()">↓ DOWNLOAD TEMPLATE</button><label class="btn primary" for="roomFile">↑ UPLOAD EXCEL FILE</label><input id="roomFile" type="file" accept=".xlsx,.xls" style="display:none" onchange="handleImportFile(this,'rooms')"><button class="btn primary" onclick="roomModalDb()">+ ADD ROOM</button></div></div><div class="cards"><div class="card"><div class="label">Total Rooms</div><div class="metric">${total}</div><div class="note">Configured for current session</div></div><div class="card"><div class="label">Available</div><div class="metric">${available}</div><div class="note good">Ready for examination use</div></div><div class="card"><div class="label">Unavailable</div><div class="metric">${unavailable}</div><div class="note">Temporarily unavailable</div></div><div class="card"><div class="label">Total Capacity</div><div class="metric">${capacity}</div><div class="note">Available rooms • 2 students per bench</div></div></div><div class="searchbar"><input placeholder="Search room, number or floor..." oninput="filterRows(this,'roomTable')"><select id="roomStatusFilter" class="btn" style="min-width:145px" onchange="filterRoomStatus(this)"><option value="">All statuses</option><option value="Available">Available</option><option value="Unavailable">Unavailable</option></select></div><div class="tablewrap"><table class="table" id="roomTable"><thead><tr><th>Room</th><th>Room Number</th><th>Capacity</th><th>Floor</th><th>Status</th><th>Actions</th></tr></thead><tbody>${(rows||[]).map(r=>`<tr data-room-status="${r.status}"><td><b>${r.room_name||'—'}</b></td><td>${r.room_number}</td><td>${r.capacity?String(r.capacity)+' benches / '+String(Number(r.capacity)*2)+' students':'—'}</td><td>${r.floor||'—'}</td><td class="${r.status==='Available'?'dotgood':''}">${r.status}</td><td class="actions-cell"><button class="btn" onclick="roomModalDb('${r.id}')">Edit</button><button class="btn danger" style="margin-left:5px" onclick="deleteRoomDb('${r.id}','${String(r.room_name||r.room_number).replace(/'/g,"&#39;")}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="6" style="text-align:center;color:#6d778b;padding:25px">No rooms configured yet.</td></tr>'}</tbody></table></div>`}

function downloadRoomTemplate(){if(!window.XLSX)return toast('Excel library is still loading. Please try again.');const rows=[['Room Number','Capacity','Room Name','Floor'],['101',40,'Room 101','Ground Floor'],['102',40,'Room 102','Ground Floor'],['H-A',80,'Hall A','First Floor']];const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:15},{wch:12},{wch:20},{wch:18}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Rooms');XLSX.writeFile(wb,'SeatChart-Rooms-Template.xlsx')}

async function loadRooms(){const v=document.getElementById('view');v.innerHTML='<div class="card">Loading rooms…</div>';const {data,error}=await db.from('sc_rooms').select('*').eq('school_id',APP.schoolId).eq('session_id',APP.sessionId).order('room_number');if(error)return v.innerHTML=`<div class="card error-note">${error.message}</div>`;v.innerHTML=roomsHtml(data||[])}

async function roomModalDb(id){let row=null;if(id){const r=await db.from('sc_rooms').select('*').eq('id',id).single();if(r.error)return toast(r.error.message);row=r.data}openModal(`<div class="modalhead"><h2>${row?'Edit':'Add'} Room</h2><button class="x" onclick="closeModal()">×</button></div><div class="split"><div class="field"><label>Room Number *</label><input id="rmNo" value="${row?.room_number||''}" placeholder="101"></div><div class="field"><label>Capacity <span style="font-weight:500;color:#8a94a5">benches</span></label><input id="rmCap" type="number" min="1" max="99" value="${row?.capacity||''}" placeholder="40"><div class="note">1 bench = 2 students</div></div></div><div class="field"><label>Room Name</label><input id="rmName" value="${row?.room_name||''}" placeholder="Optional room name"></div><div class="field"><label>Floor</label><input id="rmFloor" value="${row?.floor||''}" placeholder="Ground Floor"></div><div class="field"><label>Status</label><select id="rmStatus"><option ${row?.status!=='Unavailable'?'selected':''}>Available</option><option ${row?.status==='Unavailable'?'selected':''}>Unavailable</option></select></div><div style="text-align:right"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveRoomDb('${id||''}')">SAVE ROOM</button></div>`)}

async function saveRoomDb(id){const payload={school_id:APP.schoolId,session_id:APP.sessionId,room_name:document.getElementById('rmName').value.trim(),room_number:document.getElementById('rmNo').value.trim(),capacity:document.getElementById('rmCap').value?Number(document.getElementById('rmCap').value):null,floor:document.getElementById('rmFloor').value.trim(),status:document.getElementById('rmStatus').value||'Available'};if(!payload.room_number)return toast('Room number is required.');if(payload.capacity!==null&&(!Number.isInteger(payload.capacity)||payload.capacity<1||payload.capacity>99))return toast('Capacity must be a whole number from 1 to 99.');if(!['Available','Unavailable'].includes(payload.status))return toast('Please select a valid room status.');const dup=await db.from('sc_rooms').select('id,room_number').eq('school_id',APP.schoolId).eq('session_id',APP.sessionId);if(dup.error)return toast(dup.error.message);const sameNo=(dup.data||[]).find(x=>x.room_number&&x.room_number.toLowerCase()===payload.room_number.toLowerCase()&&x.id!==id);if(sameNo)return toast('A room with this room number already exists.');let r=id?await db.from('sc_rooms').update(payload).eq('id',id):await db.from('sc_rooms').insert(payload);if(r.error)return toast(r.error.message);await logHistory(id?'Updated':'Created','Room',id||null,payload.room_name||'Room '+payload.room_number);closeModal();toast(id?'Room updated':'Room added');loadRooms()}

async function subjectModalDb(id,classNo){let row=null;if(id){const r=await db.from('sc_subjects').select('*').eq('id',id).single();if(r.error)return toast(r.error.message);row=r.data}const classes=await db.from('sc_classes').select('id,class_number').eq('school_id',APP.schoolId).eq('session_id',APP.sessionId).order('class_number');openModal(`<div class="modalhead"><h2>${row?'Edit':'Add'} Subject</h2><button class="x" onclick="closeModal()">×</button></div><div class="split"><div class="field"><label>Class *</label><select id="subClass">${(classes.data||[]).map(c=>`<option value="${c.id}" ${c.class_number==classNo?'selected':''}>Class ${c.class_number}</option>`).join('')}</select></div><div class="field"><label>Subject *</label><input id="subName" value="${row?.subject_name||''}" placeholder="Mathematics"></div></div><div class="split"><div class="field"><label>Subject Code</label><input id="subCode" value="${row?.subject_code||''}" placeholder="MAT"></div><div class="field"><label>Status</label><select id="subStatus"><option ${row?.status!=='Inactive'?'selected':''}>Active</option><option ${row?.status==='Inactive'?'selected':''}>Inactive</option></select></div></div><div style="text-align:right"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveSubjectDb('${id||''}')">SAVE SUBJECT</button></div>`)}
async function saveSubjectDb(id){const payload={school_id:APP.schoolId,session_id:APP.sessionId,class_id:document.getElementById('subClass').value,subject_name:document.getElementById('subName').value.trim(),subject_code:document.getElementById('subCode').value.trim(),status:document.getElementById('subStatus').value};if(!payload.class_id||!payload.subject_name)return toast('Class and subject are required');let r=id?await db.from('sc_subjects').update(payload).eq('id',id):await db.from('sc_subjects').insert(payload);if(r.error)return toast(r.error.message);await logHistory(id?'Updated':'Created','Subject',id||null,payload.subject_name);closeModal();toast('Subject saved');loadSubjects()}
async function assignRollsDb(subjectId,classNo,subjectName){const sr=await db.from('sc_subjects').select('class_id').eq('id',subjectId).single();if(sr.error)return toast(sr.error.message);const sections=await db.from('sc_sections').select('id,section_name,student_count').eq('class_id',sr.data.class_id).order('section_name');if(sections.error)return toast(sections.error.message);const existing=await db.from('sc_subject_rolls').select('section_id,roll_number').eq('subject_id',subjectId);const selected=new Set((existing.data||[]).map(x=>`${x.section_id}:${x.roll_number}`));openModal(`<div class="modalhead"><h2>Assign Roll Numbers</h2><button class="x" onclick="closeModal()">×</button></div><p>Choose the students appearing for <b>${subjectName}</b>. Rolls are generated from each section's student count.</p>${(sections.data||[]).map(sec=>`<div class="section"><div class="sectitle">SECTION ${sec.section_name} — ${sec.student_count} STUDENTS</div><div class="roll-tools"><button class="btn" onclick="setSectionRolls('${sec.id}',true)">✓ SELECT ALL</button><button class="btn" onclick="setSectionRolls('${sec.id}',false)">× DESELECT ALL</button></div><div class="roll-grid">${Array.from({length:sec.student_count},(_,i)=>{const n=i+1,ck=selected.has(`${sec.id}:${n}`)?'checked':'';return `<div class="roll-check"><input type="checkbox" class="subjectRollBox" data-section="${sec.id}" value="${n}" ${ck}><label onclick="this.previousElementSibling.click()">${n}</label></div>`}).join('')}</div></div>`).join('')}<div style="text-align:right;margin-top:18px"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveRollsDb('${subjectId}')">SAVE ASSIGNMENTS</button></div>`)}

function examsHtml(){return `<div class="top"><div><h1>Exams</h1><p>Examination setup is reserved for the next development phase.</p></div></div><div class="card"><div class="cardhead"><h2>Exams</h2></div><p style="font-size:11px;color:#6d778b">No examination records are being created in the current Academics release.</p></div>`}
function usersHtml(){return `<div class="top"><div><h1>User Management</h1><p>Users belong to a single school tenant.</p></div></div><div class="card"><div class="cardhead"><h2>Current User</h2></div><div class="tablewrap"><table class="table"><tr><th>Name</th><th>Phone</th><th>Role</th></tr><tr><td>${APP.profile?.full_name||''}</td><td>${APP.profile?.phone||''}</td><td>${APP.profile?.role||''}</td></tr></table></div></div>`}
async function loadHistory(){const v=document.getElementById('view');v.innerHTML='<div class="card">Loading history…</div>';const {data,error}=await db.from('sc_history').select('*').eq('school_id',APP.schoolId).order('created_at',{ascending:false}).limit(50);if(error)return v.innerHTML=`<div class="card error-note">${error.message}</div>`;v.innerHTML=`<div class="top"><div><h1>History</h1><p>Recent academic setup actions for this school.</p></div></div><div class="card"><div class="timeline">${(data||[]).map(x=>`<div class="event"><time>${new Date(x.created_at).toLocaleString()}</time><b>${x.action} ${x.entity_type}</b><span>${x.description||''}</span></div>`).join('')||'<div class="event"><span>No history yet.</span></div>'}</div></div>`}
function profileHtml(){return `<div class="top"><div><h1>Profile Management</h1><p>School and administrator profile.</p></div></div><div class="card"><div class="split"><div><div class="label">Administrator</div><div class="metric" style="font-size:20px">${APP.profile?.full_name||''}</div><div class="note">${APP.profile?.phone||''}</div></div><div><div class="label">School</div><div class="metric" style="font-size:20px">${APP.profile?.sc_schools?.name||''}</div><div class="note">${APP.profile?.sc_schools?.address||'No address set'}</div></div></div></div>`}
function filterRows(input,id){const q=input.value.toLowerCase();document.querySelectorAll(`#${id} tbody tr`).forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
function toast(msg){const t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.style.display='block';clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.style.display='none',2800)}
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalbg').style.display='flex'}function closeModal(){document.getElementById('modalbg').style.display='none'}
async function handleImportFile(input,type){const file=input.files&&input.files[0];if(!file)return;const label=type==='classes'?'Classes & Sections':'Rooms';const reader=new FileReader();reader.onload=async e=>{try{if(!window.XLSX)throw new Error('Excel library is still loading. Please try again.');const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});if(!wb.SheetNames.length)throw new Error('The Excel file has no worksheets.');const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});if(!rows.length)throw new Error('The Excel file has no data rows.');if(type==='classes')validateClassImportRows(rows);let overwriteCount=0,newCount=rows.length;if(type==='rooms'){validateRoomImportRows(rows);const existing=await db.from('sc_rooms').select('id,room_number').eq('school_id',APP.schoolId).eq('session_id',APP.sessionId);if(existing.error)throw existing.error;const existingNumbers=new Set((existing.data||[]).filter(x=>x.room_number).map(x=>x.room_number.trim().toLowerCase()));overwriteCount=rows.filter(r=>{const number=String(r['Room Number']??r.room_number??r.Room??'').trim().toLowerCase();return existingNumbers.has(number)}).length;newCount=rows.length-overwriteCount}window.pendingImport={type,fileName:file.name,rows,overwriteCount,newCount};let details='';if(type==='rooms'){details='<p><b>'+rows.length+'</b> room records were detected.</p><p><b>'+overwriteCount+'</b> existing room'+(overwriteCount===1?' will':'s will')+' be overwritten, and <b>'+newCount+'</b> new room'+(newCount===1?'':'s')+' will be added.</p><p class="muted">Room Number is used to identify an existing room. Imported rooms will use Available status.</p>'}else{details='<p><b>'+rows.length+'</b> section records were detected for '+label+'.</p><p class="muted">Each row should contain Class, Section and Student Count. Existing matching classes/sections will be updated.</p>'}openModal('<div class="modalhead"><h2>Confirm Import</h2><button class="x" onclick="closeModal()">×</button></div><p>You selected <b>'+file.name+'</b>.</p>'+details+'<div style="text-align:right"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="confirmImportDb()">CONFIRM IMPORT</button></div>')}catch(err){toast(err.message||'Could not read Excel file')}input.value=''};reader.readAsArrayBuffer(file)}

function validateClassImportRows(rows){const seen=new Set();for(let i=0;i<rows.length;i++){const r=rows[i],cls=Number(r.Class??r.class??r['Class Number']),section=String(r.Section??r.section??'').trim().toUpperCase(),count=Number(r['Student Count']??r.student_count??r.Students??'');if(!Number.isInteger(cls)||cls<1||cls>12)throw new Error('Row '+(i+2)+': Class must be a whole number from 1 to 12.');if(!/^[A-J]$/.test(section))throw new Error('Row '+(i+2)+': Section must be a single letter from A to J.');if(!Number.isInteger(count)||count<1||count>99)throw new Error('Row '+(i+2)+': Student Count must be a whole number from 1 to 99.');const key=cls+'-'+section;if(seen.has(key))throw new Error('Duplicate Class '+cls+' / Section '+section+' found in the file.');seen.add(key)}}
async function confirmImportDb(){const imp=window.pendingImport;if(!imp)return;try{if(imp.type==='classes')await importClasses(imp.rows);else await importRooms(imp.rows);window.pendingImport=null;closeModal();toast('Import completed successfully');go(imp.type==='classes'?'classes':'rooms')}catch(e){toast(e.message||'Import failed')}}
async function importClasses(rows){const grouped={};for(const r of rows){const cls=Number(r.Class??r.class??r['Class Number']),section=String(r.Section??r.section??'').trim().toUpperCase(),count=Number(r['Student Count']??r.student_count??r.Students);if(!grouped[cls])grouped[cls]=[];grouped[cls].push({section,count})}for(const cls of Object.keys(grouped)){let {data:c,error}=await db.from('sc_classes').select('id').eq('school_id',APP.schoolId).eq('session_id',APP.sessionId).eq('class_number',Number(cls)).maybeSingle();if(error)throw error;if(!c){({data:c,error}=await db.from('sc_classes').insert({school_id:APP.schoolId,session_id:APP.sessionId,class_number:Number(cls)}).select('id').single());if(error)throw error}for(const item of grouped[cls]){const {error:e2}=await db.from('sc_sections').upsert({school_id:APP.schoolId,class_id:c.id,section_name:item.section,student_count:item.count},{onConflict:'class_id,section_name'});if(e2)throw e2}}await logHistory('Imported','Classes',null,'Excel class and section import')}
function validateRoomImportRows(rows){const seenNumbers=new Set();for(let i=0;i<rows.length;i++){const r=rows[i],number=String(r['Room Number']??r.room_number??r.Room??'').trim(),capacityValue=r.Capacity??r.capacity??'',capacity=capacityValue===''?null:Number(capacityValue);if(!number)throw new Error('Row '+(i+2)+': Room Number is required.');if(capacity!==null&&(!Number.isInteger(capacity)||capacity<1||capacity>99))throw new Error('Row '+(i+2)+': Capacity must be a whole number from 1 to 99.');const rk=number.toLowerCase();if(seenNumbers.has(rk))throw new Error('Duplicate room number found in row '+(i+2)+'.');seenNumbers.add(rk)}}
async function importRooms(rows){validateRoomImportRows(rows);const existing=await db.from('sc_rooms').select('id,room_number').eq('school_id',APP.schoolId).eq('session_id',APP.sessionId);if(existing.error)throw existing.error;const existingMap=new Map((existing.data||[]).filter(x=>x.room_number).map(x=>[x.room_number.trim().toLowerCase(),x.id]));for(const r of rows){const roomNumber=String(r['Room Number']??r.room_number??r.Room??'').trim(),capacityValue=r.Capacity??r.capacity??'',capacity=capacityValue===''?null:Number(capacityValue),roomName=String(r['Room Name']??r.room_name??'').trim(),floor=String(r.Floor??r.floor??'').trim(),existingId=existingMap.get(roomNumber.toLowerCase()),payload={school_id:APP.schoolId,session_id:APP.sessionId,room_name:roomName,room_number:roomNumber,capacity,floor,status:'Available'};const result=existingId?await db.from('sc_rooms').update(payload).eq('id',existingId):await db.from('sc_rooms').insert(payload);if(result.error)throw result.error}await logHistory('Imported','Rooms',null,'Excel room import with existing room overwrite')}

async function logout(){await db.auth.signOut();location.reload()}
async function logHistory(action,type,id,description){try{await db.from('sc_history').insert({school_id:APP.schoolId,user_id:APP.user.id,action,entity_type:type,entity_id:id||null,description})}catch(e){}}
document.getElementById('modalbg').onclick=e=>{if(e.target.id==='modalbg')closeModal()};
window.addEventListener('load',async()=>{const {data:{user}}=await db.auth.getUser();if(user){await bootstrap()}else{showAuth('login')}});
</script>
